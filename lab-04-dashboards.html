<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 04 – Dashboard-Design &amp; Plotly Dash · THWS BI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React 18.3.1 (UMD). Bewusst NICHT React 19: React 19 liefert keine UMD-Builds mehr,
       die dieses build-freie Setup (Transpilierung per text/babel im Browser) voraussetzt. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <!-- Babel bewusst auf 7.x gepinnt: Babel 8 stellt auf den automatic JSX runtime um
       und bricht damit text/babel ohne Bundler. 7.29.8 = letzter 7.x-Stand. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"
          integrity="sha384-Ux6uBqExf/7ahsSNrA9VI7vuaw6sKjDoVdjdUxmIoL2qdlzFVZ157sTi6JK3Z9Q8" crossorigin="anonymous"></script>
  <style>

    :root {
      --col-primary: #1E3A8A;
      --col-accent: #2563EB;
      --col-primary-light: rgba(30,58,138,0.08);
    }
    [data-lang="en"] {
      --col-primary: #0D9488;
      --col-accent: #0D9488;
      --col-primary-light: rgba(13,148,136,0.08);
    }
    :root {
      --primary: #1E3A8A;
      --accent: #2563EB;
      --dark: #1A1A1A;
      --light-bg: #FAFAFA;
      --primary-light: rgba(30,58,138,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; color: #1A1A1A; }
    h2 { color: #1E3A8A; font-weight: 800; font-family: 'Space Grotesk', sans-serif; margin-top: 0; }
    h3 { color: #1E3A8A; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin: 0.5rem 0; }
    p { line-height: 1.7; }

    /* Bauhaus */
    .bauhaus-card { border: 1px solid #E5E7EB; border-radius: 10px; padding: 1.5rem; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .bauhaus-accent-line { width: 48px; height: 4px; background: #2563EB; margin: 0.5rem 0 1rem 0; }
    .bauhaus-badge { background: #2563EB; color: white; padding: 0.2rem 0.7rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 0; display: inline-block; }

    /* Code */
    .code-block { background: #F3F4F6; color: #1A1A1A; padding: 1.25rem; border-left: 4px solid #D1D5DB; font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.85rem; overflow-x: auto; position: relative; border-radius: 0 8px 8px 0; white-space: pre; margin: 1rem 0; }

    /* Info boxes */
    .tip-box { border-left: 4px solid #2563EB; background: #EFF6FF; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .info-box { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .concept-box { border-left: 4px solid #1E3A8A; background: rgba(30,58,138,0.08); padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .install-box { border-left: 4px solid #059669; background: #ECFDF5; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }

    /* Layout */
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
      background: white; border-bottom: 1px solid #E5E7EB; box-shadow: 0 1px 8px rgba(0,0,0,0.05);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
    }
    .header-left { display: flex; align-items: center; gap: 1.5rem; }
    .header-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.1rem; color: #1E3A8A; text-decoration: none; }
    .header-back { font-size: 0.85rem; color: #555; text-decoration: none; font-weight: 500; }
    .header-back:hover { color: #1E3A8A; }
    .lang-btn { border: 2px solid #1A1A1A; background: white; padding: 0.2rem 0.6rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; border-radius: 4px; letter-spacing: 0.05em; }
    .lang-btn.active { background: #1E3A8A; color: white; border-color: #1E3A8A; }
    .lang-btn:hover:not(.active) { background: #f5f5f5; }

    .sidebar {
      position: fixed; top: 56px; left: 0; width: 260px;
      height: calc(100vh - 56px); overflow-y: auto;
      border-right: 1px solid #E5E7EB; background: white;
      padding: 1.5rem 0;
    }
    .sidebar-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #888; padding: 0 1.25rem; margin-bottom: 0.75rem; }
    .sidebar-link {
      display: block; padding: 0.55rem 1.25rem; font-size: 0.88rem; color: #444;
      text-decoration: none; border-left: 3px solid transparent;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      font-weight: 500;
    }
    .sidebar-link:hover { color: #1E3A8A; background: rgba(30,58,138,0.04); }
    .sidebar-link.active { color: #1E3A8A; border-left-color: #1E3A8A; background: rgba(30,58,138,0.06); font-weight: 700; }

    .main-content {
      margin-left: 260px; padding-top: 72px; padding-bottom: 4rem;
      padding-left: 3rem; padding-right: 3rem; max-width: 960px;
    }
    .section-block { margin-bottom: 4rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    /* ── Kennzeichnung kopierbarer Codebloecke ───────────────────────────────
       Jeder Block sagt, ob er in einer frischen Umgebung so laeuft ("run")
       oder ob er ein Konzeptsnippet mit Platzhalternamen ist ("concept"). */
    .code-tag { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 5px 5px 0 0; }
    .code-tag-run { background: #065F46; color: #fff; }
    .code-tag-concept { background: #92400E; color: #fff; }
    .code-tag + .code-block { border-radius: 0 8px 8px 0; margin-top: 0; }
    .code-note { font-size: 0.78rem; color: #4B5563; margin: 0.35rem 0 0; line-height: 1.55; }
    /* ── Quiz: zweiter Versuch statt Einmal-Sperre ───────────────────────────
       Eine falsche Antwort sperrt die Frage nicht mehr. Die Loesung wird erst
       gezeigt, wenn sie getroffen oder ausdruecklich angefordert wurde. */
    .quiz-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .quiz-retry-btn { font-family: inherit; font-size: 0.82rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1.5px solid var(--col-primary, #1E3A8A); background: white; color: var(--col-primary, #1E3A8A); cursor: pointer; }
    .quiz-retry-btn:hover { background: rgba(30,58,138,0.06); }
    .quiz-retry-btn.secondary { border-color: #9CA3AF; color: #4B5563; }
    .quiz-retry-btn.secondary:hover { background: #F3F4F6; }
    .quiz-hint { margin-top: 0.6rem; font-size: 0.85rem; line-height: 1.6; color: #92400E; background: #FFFBEB; border-left: 3px solid #F59E0B; padding: 0.55rem 0.9rem; border-radius: 0 6px 6px 0; }
    .quiz-attempts { font-size: 0.78rem; color: #6B7280; align-self: center; }
    /* ── Responsive Guards (Mobilnutzung) ────────────────────────────────────
       Tabellen und Codebloecke duerfen breiter sein als der Viewport, aber sie
       scrollen dann in ihrem eigenen Container. Die Seite selbst scrollt nie
       horizontal. Pruefwert: document.scrollWidth <= window.innerWidth bei
       320 / 390 / 768 / 1024 / 1440 px. */
    .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0; }
    .table-wrap > table { margin: 0; }
    /* Flex- und Grid-Kinder duerfen unter ihre Inhaltsbreite schrumpfen,
       sonst sprengt ein <pre> den Elternteil (min-width:auto ist der Default). */
    .step-content, .step-block > * { min-width: 0; }
    .section-block, .content, main { min-width: 0; }
    .code-block { max-width: 100%; }
    /* Lange Bezeichner ohne Leerzeichen (Spaltennamen, URLs) umbrechen lassen. */
    p, li, td, th, h1, h2, h3, h4 { overflow-wrap: break-word; }
    code { overflow-wrap: anywhere; word-break: break-word; }
    .tip-box, .info-box, .concept-box, .challenge-box, .youtube-box { max-width: 100%; overflow-wrap: break-word; }
    th { background: #1E3A8A; color: white; padding: 0.65rem 1rem; text-align: left; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.05em; }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid #e5e7eb; }
    tr:nth-child(even) td { background: #f9fafb; }
    tr:hover td { background: rgba(30,58,138,0.03); }
    td code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.82rem; background: #F3F4F6; padding: 0.1rem 0.35rem; border-radius: 3px; }

    /* Nav bottom */
    .nav-bottom { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; padding: 1.5rem 0; border-top: 1px solid #E5E7EB; }
    .nav-btn { border: 2px solid #1A1A1A; background: white; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; color: #1A1A1A; font-family: 'Space Grotesk', sans-serif; display: inline-block; border-radius: 4px; }
    .nav-btn:hover { background: #1E3A8A; color: white; border-color: #1E3A8A; }
    .nav-btn.primary { background: #1E3A8A; border-color: #1E3A8A; color: white; }
    .nav-btn.primary:hover { background: #1e40af; border-color: #1e40af; }

    /* Lab header */
    .lab-header { padding: 3rem 3rem 2rem; margin-left: 260px; padding-top: 88px; }
    .lab-num { font-family: 'Space Grotesk', sans-serif; font-size: 4rem; font-weight: 900; color: #2563EB; line-height: 1; margin-bottom: 0.5rem; }
    .lab-title-h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 800; color: #1A1A1A; margin-bottom: 0.75rem; }
    .lab-desc-intro { font-size: 1.1rem; color: #4B5563; line-height: 1.6; max-width: 680px; margin-bottom: 1.5rem; }
    .lernziele-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .lernziel-chip { background: rgba(30,58,138,0.08); color: #1E3A8A; border: 1px solid rgba(30,58,138,0.2); padding: 0.3rem 0.75rem; font-size: 0.8rem; font-weight: 600; border-radius: 20px; font-family: 'Space Grotesk', sans-serif; }

    /* YouTube box */
    .youtube-box { background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 10px; padding: 1.5rem; margin: 2rem 0; }
    .youtube-box h3 { color: #EA580C; margin-top: 0; }
    .youtube-link { color: #EA580C; text-decoration: none; font-weight: 600; }
    .youtube-link:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; padding-left: 1.25rem; padding-right: 1.25rem; }
      .lab-header { margin-left: 0; padding-left: 1.25rem; padding-right: 1.25rem; }
    }

    /* Footer */
    .footer { background: #1A1A1A; color: rgba(255,255,255,0.6); text-align: center; padding: 1.5rem; margin-left: 260px; font-size: 0.85rem; }
    @media (max-width: 768px) { .footer { margin-left: 0; } }
  
    /* ── EN mode: Teal #0D9488 (mirrors index.html) ── */
    [data-lang="en"] h2,
    [data-lang="en"] h3 { color: #0D9488; }
    [data-lang="en"] h4 { color: #0D9488; }
    [data-lang="en"] .bauhaus-accent-line { background: #14B8A6; }
    [data-lang="en"] .bauhaus-badge { background: #0D9488; }
    [data-lang="en"] .header-logo { color: #0D9488; }
    [data-lang="en"] .lang-btn.active { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .sidebar-link:hover { color: #0D9488; background: rgba(13,148,136,0.04); }
    [data-lang="en"] .sidebar-link.active { color: #0D9488; border-left-color: #0D9488; background: rgba(13,148,136,0.06); }
    [data-lang="en"] .lernziel-chip { background: rgba(13,148,136,0.1); color: #0D9488; border-color: rgba(13,148,136,0.25); }

    [data-lang="en"] th { background: #0D9488; }
    [data-lang="en"] .lab-num { color: #0D9488; }
    [data-lang="en"] .nav-btn.primary { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .nav-btn.primary:hover { background: #0f766e; border-color: #0f766e; }
    [data-lang="en"] .tip-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .concept-box { border-left-color: #0D9488; background: rgba(13,148,136,0.08); }
    [data-lang="en"] .info-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .challenge-box { border-left-color: #0D9488; }
    .quiz-option:hover:not(:disabled) { border-color: #2563EB; background: rgba(37,99,235,0.04); }
    [data-lang="en"] .quiz-option:hover:not(:disabled) { border-color: #0D9488; background: rgba(13,148,136,0.04); }
    [data-lang="en"] .footer { background: #0D9488; }
  
    /* ── Barrierefreiheit ────────────────────────────────────────────────────
       sr-only blendet Text visuell aus, laesst ihn aber vorlesbar. Wird fuer
       die Antwortzustaende im Quiz und den Sprunglink gebraucht. */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .quiz-mark { font-weight: 800; margin-right: 0.4rem; }
    .skip-link { position: absolute; left: -9999px; top: 0; z-index: 200; background: var(--col-primary, #1E3A8A); color: #fff; padding: 0.6rem 1rem; border-radius: 0 0 6px 0; font-weight: 700; text-decoration: none; }
    .skip-link:focus { left: 0; }
    /* Sichtbarer Fokus - der Browser-Default verschwindet auf farbigen Flaechen. */
    a:focus-visible, button:focus-visible { outline: 3px solid #F59E0B; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Ausfallsicherung fuer die CDN-Abhaengigkeiten.
       React, ReactDOM und Babel kommen von unpkg.com. Faellt der Dienst aus
       oder sperrt ein Hochschulnetz die Domain, blieb die Seite bisher weiss
       und der Lernende sah keinen Hinweis, woran es liegt. Dieses Skript
       laeuft nach den drei Script-Tags und prueft, was tatsaechlich geladen
       wurde; ausserdem prueft es nach fuenf Sekunden, ob die App gemountet
       hat (faengt Transpilierungsfehler ab). -->
  <script>
  (function () {
    var isEn = new URLSearchParams(location.search).get('lang') === 'en'
            || (localStorage.getItem('bi-lang') || '') === 'en';
    var T = isEn ? {
      head: 'This page could not load',
      miss: 'The following libraries were not delivered:',
      why: 'The page loads React and Babel from unpkg.com at runtime. If your network blocks that host, or the service is unavailable, nothing can be rendered.',
      what: 'What you can do:',
      s1: 'Reload the page - the CDN is often only briefly unavailable.',
      s2: 'Try a different network (mobile hotspot instead of campus Wi-Fi).',
      s3: 'Check whether a proxy, VPN or content blocker is blocking unpkg.com.',
      s4: 'If it persists, report it - the lab content itself is fine, only the delivery failed.',
      slow: 'The libraries loaded, but the page did not render. That points to a script error rather than the network. Please report it with the browser console output.'
    } : {
      head: 'Diese Seite konnte nicht geladen werden',
      miss: 'Folgende Bibliotheken wurden nicht ausgeliefert:',
      why: 'Die Seite laedt React und Babel zur Laufzeit von unpkg.com. Sperrt das Netz diesen Host oder ist der Dienst gestoert, kann nichts dargestellt werden.',
      what: 'Was du tun kannst:',
      s1: 'Seite neu laden - das CDN ist oft nur kurz nicht erreichbar.',
      s2: 'Ein anderes Netz probieren (Mobilfunk statt Campus-WLAN).',
      s3: 'Pruefen, ob ein Proxy, VPN oder Contentblocker unpkg.com blockiert.',
      s4: 'Bleibt es dabei: melden - die Lab-Inhalte sind in Ordnung, nur die Auslieferung ist gescheitert.',
      slow: 'Die Bibliotheken sind geladen, die Seite hat aber nicht gerendert. Das deutet auf einen Skriptfehler hin, nicht auf das Netz. Bitte mit der Ausgabe der Browser-Konsole melden.'
    };

    function panel(title, body) {
      var root = document.getElementById('root') || document.body;
      root.innerHTML =
        '<div style="max-width:44rem;margin:4rem auto;padding:1.75rem;font-family:' +
        "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" +
        ';line-height:1.65;color:#1A1A1A;background:#fff;border:1px solid #E5E7EB;' +
        'border-left:5px solid #DC2626;border-radius:0 10px 10px 0">' +
        '<h1 style="margin:0 0 .75rem;font-size:1.3rem;color:#991B1B">' + title + '</h1>' +
        body +
        '<p style="margin-top:1.25rem;font-size:.85rem;color:#6B7280">' +
        '<a href="index.html" style="color:#1E3A8A">BI Lab</a> &middot; THWS Business School</p>' +
        '</div>';
    }

    var missing = [];
    if (typeof window.React === 'undefined') missing.push('React');
    if (typeof window.ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof window.Babel === 'undefined') missing.push('Babel');

    if (missing.length) {
      panel(T.head,
        '<p><strong>' + T.miss + '</strong> ' + missing.join(', ') + '</p>' +
        '<p>' + T.why + '</p>' +
        '<p><strong>' + T.what + '</strong></p>' +
        '<ol style="padding-left:1.25rem"><li>' + T.s1 + '</li><li>' + T.s2 +
        '</li><li>' + T.s3 + '</li><li>' + T.s4 + '</li></ol>');
      return;
    }

    // Bibliotheken da, aber die App mountet nicht -> Skriptfehler.
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        panel(T.head, '<p>' + T.slow + '</p>');
      }
    }, 5000);
  })();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── CodeBlock Component ──────────────────────────────────────────────────
    function CodeBlock({ code, lang, kind, note }) {
      const [copied, setCopied] = React.useState(false);
      const copy = () => {
        navigator.clipboard.writeText(code).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        }).catch(() => {
          const el = document.createElement('textarea');
          el.value = code;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        });
      };
      const labelCopy = lang === 'en' ? 'Copy' : 'Kopieren';
      const labelDone = lang === 'en' ? '\u2713 Copied' : '\u2713 Kopiert';
      return (
        <div style={{ position: 'relative', marginBottom: '1rem' }}>
          {kind && (
            <div className={'code-tag ' + (kind === 'run' ? 'code-tag-run' : 'code-tag-concept')}>
              {kind === 'run'
                ? (lang === 'en' ? 'Runnable as-is' : 'L\u00E4uft unver\u00E4ndert')
                : kind === 'diagram'
                  ? (lang === 'en' ? 'Schema \u2013 not code' : 'Schema \u2013 kein Code')
                  : (lang === 'en' ? 'Concept \u2013 placeholder names' : 'Konzept \u2013 Platzhalternamen')}
            </div>
          )}
          <pre className="code-block">{code}</pre>
          {note && <p className="code-note">{note}</p>}
          <button onClick={copy} style={{
            position: 'absolute', top: '0.5rem', right: '0.5rem',
            background: copied ? '#059669' : '#E5E7EB',
            color: copied ? 'white' : '#374151',
            border: 'none', borderRadius: '4px',
            padding: '0.2rem 0.5rem', fontSize: '0.75rem',
            cursor: 'pointer', fontFamily: 'Space Grotesk, sans-serif'
          }}>
            {copied ? labelDone : labelCopy}
          </button>
        </div>
      );
    }

    // ─── QuizQuestion Component ──────────────────────────────────────────────
    function QuizQuestion({ question, index, lang }) {
      // Mastery statt One-shot: falsche Antwort sperrt die Frage nicht mehr.
      const [selected, setSelected] = React.useState(null);
      const [revealed, setRevealed] = React.useState(false);
      const [attempts, setAttempts] = React.useState(0);
      const solved = selected === question.correct;
      const wrongPick = selected !== null && !solved;

      const pick = (oi) => {
        if (revealed) return;
        setSelected(oi);
        setAttempts((n) => n + 1);
        if (oi === question.correct) setRevealed(true);
      };

      return (
        <div style={{ marginBottom: '1.5rem', padding: '1.25rem', background: 'white', border: '1px solid #E5E7EB', borderRadius: '10px' }}>
          <p style={{ fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", margin: '0 0 0.75rem', color: '#1A1A1A' }}>
            {index + 1}. {question.q}
          </p>
          <div style={{ display: 'grid', gap: '0.5rem' }}>
            {question.options.map((opt, oi) => {
              let bg = 'white'; let border = '#D1D5DB'; let color = '#374151'; let mark = null;
              // Zustand nie nur ueber Farbe - das Zeichen steht im DOM.
              if (revealed && oi === question.correct) { bg = '#D1FAE5'; border = '#059669'; color = '#065F46'; mark = '\u2713'; }
              else if (oi === selected && oi !== question.correct) { bg = '#FEE2E2'; border = '#DC2626'; color = '#991B1B'; mark = '\u2717'; }
              return (
                <button key={oi} disabled={revealed} onClick={() => pick(oi)}
                  className="quiz-option"
                  style={{
                    textAlign: 'left', padding: '0.6rem 1rem', fontSize: '0.88rem',
                    background: bg, border: '1.5px solid ' + border, borderRadius: '6px',
                    color, cursor: revealed ? 'default' : 'pointer',
                    fontFamily: 'inherit', transition: 'border-color 0.15s, background 0.15s'
                  }}>
                  {mark && <span className="quiz-mark" aria-hidden="true">{mark}</span>}
                  {mark && <span className="sr-only">
                    {mark === '\u2713'
                      ? (lang === 'en' ? 'Correct answer: ' : 'Richtige Antwort: ')
                      : (lang === 'en' ? 'Your wrong answer: ' : 'Deine falsche Antwort: ')}
                  </span>}
                  {opt}
                </button>
              );
            })}
          </div>

          {wrongPick && !revealed && (
            <div className="quiz-hint" role="status" aria-live="polite">
              {lang === 'en'
                ? '\u2717 Not quite. Re-read the question and try again \u2013 or reveal the answer.'
                : '\u2717 Noch nicht richtig. Lies die Frage noch einmal und versuche es erneut \u2013 oder lass dir die L\u00F6sung zeigen.'}
            </div>
          )}

          {wrongPick && !revealed && (
            <div className="quiz-actions">
              <button type="button" className="quiz-retry-btn" onClick={() => setSelected(null)}>
                {lang === 'en' ? 'Try again' : 'Nochmal versuchen'}
              </button>
              <button type="button" className="quiz-retry-btn secondary" onClick={() => setRevealed(true)}>
                {lang === 'en' ? 'Show answer' : 'L\u00F6sung anzeigen'}
              </button>
              <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
            </div>
          )}

          {revealed && (
            <p style={{ marginTop: '0.5rem', fontSize: '0.85rem', fontWeight: 600, color: solved ? '#059669' : '#B45309' }} role="status" aria-live="polite">
              {solved
                ? (lang === 'en' ? '\u2713 Correct!' : '\u2713 Richtig!')
                : (lang === 'en' ? 'Answer shown' : 'L\u00F6sung eingeblendet')}
            </p>
          )}
          {revealed && question.explanation && (
            <p style={{ marginTop: '0.35rem', fontSize: '0.85rem', lineHeight: 1.6, color: '#374151' }}>
              {question.explanation}
            </p>
          )}
          {revealed && (
            <div className="quiz-actions">
              <button type="button" className="quiz-retry-btn secondary"
                onClick={() => { setSelected(null); setRevealed(false); setAttempts(0); }}>
                {lang === 'en' ? 'Reset question' : 'Frage zur\u00FCcksetzen'}
              </button>
              {attempts > 1 && (
                <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {

      const [activeSection, setActiveSection] = useState('design-prinzipien');

      const setLangAndStore = (l) => {
        setLang(l);
        localStorage.setItem('bi-lang', l);
      };

      useEffect(() => {
        const sections = ['design-prinzipien', 'plotly-express', 'plotly-dash', 'vergleich', 'youtube', 'quiz', 'zusammenfassung'];

            const el = document.getElementById(sections[i]);
            if (el && el.getBoundingClientRect().top <= 100) {
              setActiveSection(sections[i]);
              return;
            }
          }
          setActiveSection('design-prinzipien');
        };
        window.addEventListener('scroll', handler, { passive: true });
        return () => window.removeEventListener('scroll', handler);
      }, []);

      const tx = translations[lang];

      // Tab-Titel und html[lang] der gewaehlten Sprache folgen lassen

        document.title = 'Lab 04 \u2013 ' + tx.title + ' \u00B7 THWS BI Lab';

                <p style={{ margin: 0 }}>{tx.s1AccessText}</p>
              </div>

              {/* Tufte / Few reference */}
              <div className="tip-box" style={{ marginTop: '1rem' }}>
                <p style={{ margin: 0, fontSize: '0.875rem' }}>{tx.s1TufteRef}</p>
              </div>
            </section>

            {/* ── Section 2: Plotly Express ── */}
            <section id="plotly-express" className="section-block">
              <h2>{tx.s2Title}</h2>
              <div className="bauhaus-accent-line"></div>
              <p>{tx.s2Desc}</p>

              {/* Datensatz-Beschaffung – ohne die Datei laeuft kein Codeblock hier */}
              <div className="info-box" style={{ marginTop: '1.25rem' }}>
                <h4 style={{ marginTop: 0, color: 'var(--col-primary)' }}>{tx.dataTitle}</h4>
                <p style={{ margin: '0 0 0.75rem' }}>{tx.dataText}</p>
                <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                  <a href="starter/lab-04-dash.zip" download
                     style={{ border: '1.5px solid var(--col-primary)', color: 'var(--col-primary)',
                              textDecoration: 'none', padding: '0.45rem 0.9rem', borderRadius: '6px',
                              fontSize: '0.82rem', fontWeight: 700 }}>
                    {tx.starterBtn}
                  </a>
                  <a href="data/train.csv" download
                     style={{ background: 'var(--col-primary)', color: 'white', textDecoration: 'none',
                              padding: '0.45rem 0.9rem', borderRadius: '6px', fontSize: '0.82rem', fontWeight: 700 }}>
                    {tx.dataDirect}
                  </a>
                  <a href="https://www.kaggle.com/datasets/rohitsahoo/sales-forecasting"
                     target="_blank" rel="noopener noreferrer"
                     style={{ border: '1.5px solid var(--col-primary)', color: 'var(--col-primary)',
                              textDecoration: 'none', padding: '0.45rem 0.9rem', borderRadius: '6px',
                              fontSize: '0.82rem', fontWeight: 700 }}>
                    {tx.dataKaggle}
                  </a>
                </div>
              </div>

              <h3 style={{ marginTop: '1.5rem' }}>{tx.s2Code1Title}</h3>
              <CodeBlock code={CODE_PX_BAR[lang]} lang={lang} kind="run" note={tx.runNoteCsv} />

              <h3 style={{ marginTop: '1.5rem' }}>{tx.s2Code2Title}</h3>
              <CodeBlock code={CODE_PX_LINE[lang]} lang={lang} kind="run" note={tx.runNoteCsv} />

              <h3 style={{ marginTop: '1.5rem' }}>{tx.s2Code3Title}</h3>
              <CodeBlock code={CODE_PX_SCATTER[lang]} lang={lang} kind="run" note={tx.runNoteCsv} />
            </section>

            {/* ── Section 3: Plotly Dash ── */}
            <section id="plotly-dash" className="section-block">
              <h2>{tx.s3Title}</h2>
              <div className="bauhaus-accent-line"></div>
              <p>{tx.s3Desc}</p>

              <h3 style={{ marginTop: '1.5rem' }}>{tx.s3ArchTitle}</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '1rem', margin: '1rem 0 2rem' }}>
                {tx.s3Concepts.map((c, i) => (
                  <div key={i} className="info-box" style={{ margin: 0 }}>
                    <h4 style={{ marginTop: 0, color: 'var(--col-primary)' }}>{c.title}</h4>
                    <p style={{ margin: 0, fontSize: '0.875rem', color: '#374151', lineHeight: 1.6 }}>{c.desc}</p>
                  </div>
                ))}
              </div>

              <h3 style={{ marginTop: '2rem' }}>{tx.s3AppTitle}</h3>
              <CodeBlock code={CODE_DASH_APP[lang]} lang={lang} kind="run" note={tx.runNoteApp} />
              <div className="challenge-box">
                <h4 style={{ marginTop: 0 }}>{tx.selfCheckTitle}</h4>
                <ul style={{ margin: 0, paddingLeft: '1.15rem', lineHeight: 1.8, fontSize: '0.88rem' }}>
                  {tx.selfCheckItems.map((item, i) => <li key={i}>{item}</li>)}
                </ul>
              </div>

              <h3 style={{ marginTop: '1.5rem' }}>{tx.s3InstallTitle}</h3>
              <div className="install-box">
                <p style={{ margin: '0 0 0.5rem', fontWeight: 700, color: '#065F46', fontSize: '0.85rem', fontFamily: "'Space Grotesk', sans-serif" }}>
                  {'Terminal'}
                </p>
                <CodeBlock code={CODE_INSTALL[lang]} lang={lang} kind="run" />
              </div>

              {/* Google Colab note */}
              <div className="info-box" style={{ marginTop: '1rem' }}>
                <p style={{ margin: 0, fontSize: '0.875rem' }}>{tx.s3ColabNote}</p>
              </div>

              <h3 style={{ marginTop: '2.5rem' }}>{tx.s3DeployTitle}</h3>
              <div className="concept-box">
                <p style={{ margin: '0 0 0.5rem', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, color: 'var(--col-primary)', fontSize: '0.9rem' }}>{tx.s3DeployDesc}</p>
              </div>

              <h4 style={{ marginTop: '1.5rem', color: 'var(--col-primary)' }}>{tx.s3GunicornTitle}</h4>
              <p style={{ margin: '0.25rem 0 0.5rem', fontSize: '0.9rem', color: '#374151' }}>{tx.s3GunicornDesc}</p>
              <CodeBlock code={CODE_GUNICORN[lang]} lang={lang} kind="run" />

              <h4 style={{ marginTop: '1.5rem', color: 'var(--col-primary)' }}>{tx.s3DockerTitle}</h4>
              <p style={{ margin: '0.25rem 0 0.5rem', fontSize: '0.9rem', color: '#374151' }}>{tx.s3DockerDesc}</p>
              <p style={{ margin: '0.25rem 0 0.5rem', fontSize: '0.9rem', color: '#374151' }}>{tx.s3ReqDesc}</p>
              <CodeBlock code={CODE_REQUIREMENTS[lang]} lang={lang} kind="run" />
              <CodeBlock code={CODE_DOCKERFILE} lang={lang} kind="run" />

              <div className="tip-box" style={{ marginTop: '1rem' }}>
                <strong style={{ color: 'var(--col-primary)' }}>{tx.s3TraefikTitle}:</strong>{' '}
                <span style={{ fontSize: '0.9rem', color: '#1e40af' }}>{tx.s3TraefikDesc}</span>
              </div>
            </section>

            {/* ── Section 4: Vergleich ── */}
            <section id="vergleich" className="section-block">
              <h2>{tx.s4Title}</h2>
              <div className="bauhaus-accent-line"></div>
              <p>{tx.s4Desc}</p>

              <div className="table-wrap">
                <table>
                <thead>
                  <tr>
                    {tx.s4Headers.map((h, i) => <th key={i}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {tx.s4Rows.map((row, i) => (
                    <tr key={i}>
                      <td style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: 'var(--col-primary)' }}>{row[0]}</td>
                      <td>{row[1]}</td>
                      <td>{row[2]}</td>
                    </tr>
                  ))}
                </tbody>
                </table>
              </div>

              <div className="concept-box" style={{ marginTop: '1.5rem' }}>
                <h4 style={{ marginTop: 0, color: 'var(--col-primary)' }}>{tx.s4RecommTitle}</h4>
                <p style={{ margin: 0, fontSize: '0.9rem' }}>{tx.s4RecommText}</p>
              </div>
              <div className="tip-box" style={{ marginTop: '1rem' }}>
                <p style={{ margin: 0, fontSize: '0.875rem', color: '#374151' }}><em>{tx.s4VendorNote}</em></p>
              </div>

              {/* Streamlit alternative */}
              <div className="info-box" style={{ marginTop: '1rem' }}>
                <h4 style={{ marginTop: 0, color: 'var(--col-primary)' }}>{tx.s4StreamlitTitle}</h4>
                <p style={{ margin: 0 }}>{tx.s4StreamlitText}</p>
              </div>
            </section>

            {/* ── Section 5: YouTube-Ressourcen ── */}
            <section id="youtube" className="section-block">
              <h2>{tx.s5Title}</h2>
              <div className="bauhaus-accent-line"></div>
              <p>{tx.s5Desc}</p>

              <div className="youtube-box">
                <h3>{'YouTube'}</h3>

                <p style={{ margin: '0 0 1rem', fontSize: '0.8rem', color: '#78350F' }}>

                  {tx.ytNote}

                </p>
                {tx.s5Resources.map((res, i) => (
                  <div key={i} style={{
                    marginBottom: i < tx.s5Resources.length - 1 ? '1.25rem' : 0,
                    paddingBottom: i < tx.s5Resources.length - 1 ? '1.25rem' : 0,
                    borderBottom: i < tx.s5Resources.length - 1 ? '1px solid #FED7AA' : 'none'
                  }}>
                    <a href={res.url} target="_blank" rel="noopener noreferrer" className="youtube-link">{res.title}</a>
                    <p style={{ margin: '0.25rem 0 0', fontSize: '0.875rem', color: '#78350F' }}>{res.desc}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* ── Section 6: Quiz ── */}
            <section id="quiz" className="section-block">
              <h2>{tx.quizTitle}</h2>
              <div className="bauhaus-accent-line"></div>
              {tx.quizQuestions.map((qq, qi) => (
                <QuizQuestion key={qi} question={qq} index={qi} lang={lang} />
              ))}
            </section>

            {/* ── Section 7: Zusammenfassung ── */}
            <section id="zusammenfassung" className="section-block">
              <h2>{tx.summaryTitle}</h2>
              <div className="bauhaus-accent-line"></div>
              <div className="concept-box">
                <ol style={{ margin: 0, paddingLeft: '1.25rem' }}>
                  {tx.summaryItems.map((item, i) => (
                    <li key={i} style={{ fontSize: '0.9rem', lineHeight: 1.7, color: '#1A1A1A', marginBottom: '0.35rem' }}>{item}</li>
                  ))}
                </ol>
              </div>
            </section>

            {/* ── Nav Bottom ── */}
            <div className="nav-bottom">
              <a href={'lab-03-kpis.html' + (lang === 'en' ? '?lang=en' : '')} className="nav-btn">
                {tx.navPrev}
              </a>
              <a href={'lab-05-fallstudie.html' + (lang === 'en' ? '?lang=en' : '')} className="nav-btn primary">
                {tx.navNext}
              </a>
            </div>

          </main>

          {/* Footer */}
          <footer className="footer">
            {'THWS Business School \u00B7 BI Lab \u00B7 Prof. Dr. Robert Butscher \u00B7 2026'}
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
