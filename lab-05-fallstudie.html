<!DOCTYPE html>
<html lang="de">
<head>

  <!-- React 18.3.1 (UMD). Bewusst NICHT React 19: React 19 liefert keine UMD-Builds mehr,
       die dieses build-freie Setup (Transpilierung per text/babel im Browser) voraussetzt. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"

  <!-- Babel bewusst auf 7.x gepinnt: Babel 8 stellt auf den automatic JSX runtime um
       und bricht damit text/babel ohne Bundler. 7.29.8 = letzter 7.x-Stand. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"
          integrity="sha384-Ux6uBqExf/7ahsSNrA9VI7vuaw6sKjDoVdjdUxmIoL2qdlzFVZ157sTi6JK3Z9Q8" crossorigin="anonymous"></script>
  <style>

    :root {
      --col-primary: #1E3A8A;
      --col-accent: #2563EB;
      --col-primary-light: rgba(30,58,138,0.08);

    [data-lang="en"] {
      --col-primary: #0D9488;
      --col-accent: #0D9488;
      --col-primary-light: rgba(13,148,136,0.08);
    }
    :root { --primary: #1E3A8A; --accent: #2563EB; --dark: #1A1A1A; --light-bg: #FAFAFA; }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; color: #1A1A1A; }
    h2 { color: #1E3A8A; font-weight: 800; font-family: 'Space Grotesk', sans-serif; margin-top: 0; }
    h3 { color: #1E3A8A; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin: 0.5rem 0; }
    p { line-height: 1.7; }

    .bauhaus-badge { background: #2563EB; color: white; padding: 0.2rem 0.7rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; }
    .code-block { background: #F3F4F6; color: #1A1A1A; border-left: 4px solid #D1D5DB; font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.82rem; padding: 1rem 1.25rem; border-radius: 0 8px 8px 0; white-space: pre; overflow-x: auto; position: relative; margin: 1rem 0; }
    .tip-box { border-left: 4px solid #2563EB; background: #EFF6FF; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .info-box { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .concept-box { border-left: 4px solid #1E3A8A; background: rgba(30,58,138,0.08); padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .challenge-box { border-left: 4px solid #22c55e; background: #f0fdf4; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .youtube-box { background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 10px; padding: 1.5rem; margin: 1rem 0; }

    .youtube-box h4 { color: #EA580C; margin-top: 0; }

    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    /* ── Kennzeichnung kopierbarer Codebloecke ───────────────────────────────
       Jeder Block sagt, ob er in einer frischen Umgebung so laeuft ("run")

    .code-tag { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 5px 5px 0 0; }
    .code-tag-run { background: #065F46; color: #fff; }
    .code-tag-concept { background: #92400E; color: #fff; }
    .code-tag + .code-block { border-radius: 0 8px 8px 0; margin-top: 0; }
    .code-note { font-size: 0.78rem; color: #4B5563; margin: 0.35rem 0 0; line-height: 1.55; }
    /* ── Quiz: zweiter Versuch statt Einmal-Sperre ───────────────────────────
       Eine falsche Antwort sperrt die Frage nicht mehr. Die Loesung wird erst
       gezeigt, wenn sie getroffen oder ausdruecklich angefordert wurde. */
    .quiz-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .quiz-retry-btn { font-family: inherit; font-size: 0.82rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1.5px solid var(--col-primary, #1E3A8A); background: white; color: var(--col-primary, #1E3A8A); cursor: pointer; }

    .quiz-retry-btn.secondary:hover { background: #F3F4F6; }
    .quiz-hint { margin-top: 0.6rem; font-size: 0.85rem; line-height: 1.6; color: #92400E; background: #FFFBEB; border-left: 3px solid #F59E0B; padding: 0.55rem 0.9rem; border-radius: 0 6px 6px 0; }
    .quiz-attempts { font-size: 0.78rem; color: #6B7280; align-self: center; }
    /* ── Responsive Guards (Mobilnutzung) ────────────────────────────────────
       Tabellen und Codebloecke duerfen breiter sein als der Viewport, aber sie
       scrollen dann in ihrem eigenen Container. Die Seite selbst scrollt nie
       horizontal. Pruefwert: document.scrollWidth <= window.innerWidth bei
       320 / 390 / 768 / 1024 / 1440 px. */
    .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0; }
    .table-wrap > table { margin: 0; }
    /* Flex- und Grid-Kinder duerfen unter ihre Inhaltsbreite schrumpfen,
       sonst sprengt ein <pre> den Elternteil (min-width:auto ist der Default). */
    .step-content, .step-block > * { min-width: 0; }
    .section-block, .content, main { min-width: 0; }
    .code-block { max-width: 100%; }
    /* Lange Bezeichner ohne Leerzeichen (Spaltennamen, URLs) umbrechen lassen. */
    p, li, td, th, h1, h2, h3, h4 { overflow-wrap: break-word; }
    code { overflow-wrap: anywhere; word-break: break-word; }
    .tip-box, .info-box, .concept-box, .challenge-box, .youtube-box { max-width: 100%; overflow-wrap: break-word; }
    th { background: #1E3A8A; color: white; padding: 0.65rem 1rem; text-align: left; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.05em; }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid #e5e7eb; }
    tr:nth-child(even) td { background: #f9fafb; }

    td code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.82rem; background: #F3F4F6; padding: 0.1rem 0.35rem; border-radius: 3px; }

    .nav-bottom { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; padding: 1.5rem 0; border-top: 1px solid #E5E7EB; }
    .nav-btn { border: 2px solid #1A1A1A; background: white; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; color: #1A1A1A; font-family: 'Space Grotesk', sans-serif; display: inline-block; border-radius: 4px; }
    .nav-btn:hover { background: #1E3A8A; color: white; border-color: #1E3A8A; }
    .nav-btn.primary { background: #1E3A8A; border-color: #1E3A8A; color: white; }
    .nav-btn.primary:hover { background: #1e40af; border-color: #1e40af; }

    .lab-header { padding: 3rem 3rem 2rem; margin-left: 260px; padding-top: 88px; }

    .lab-title-h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 800; color: #1A1A1A; margin-bottom: 0.75rem; }
    .lab-desc-intro { font-size: 1.1rem; color: #4B5563; line-height: 1.6; max-width: 680px; margin-bottom: 1.5rem; }

    .footer { background: #1A1A1A; color: rgba(255,255,255,0.6); text-align: center; padding: 1.5rem; margin-left: 260px; font-size: 0.85rem; }

      .main-content { margin-left: 0; padding-left: 1.25rem; padding-right: 1.25rem; }
      .lab-header { margin-left: 0; padding-left: 1.25rem; padding-right: 1.25rem; }
      .footer { margin-left: 0; }
    }

    /* ── EN mode: Teal #0D9488 ── */
    [data-lang="en"] h2,
    [data-lang="en"] h3 { color: #0D9488; }
    [data-lang="en"] h4 { color: #0D9488; }
    [data-lang="en"] .bauhaus-accent-line { background: #14B8A6; }
    [data-lang="en"] .bauhaus-badge { background: #0D9488; }
    [data-lang="en"] .header-logo { color: #0D9488; }
    [data-lang="en"] .lang-btn.active { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .sidebar-link:hover { color: #0D9488; background: rgba(13,148,136,0.04); }
    [data-lang="en"] .sidebar-link.active { color: #0D9488; border-left-color: #0D9488; background: rgba(13,148,136,0.06); }
    [data-lang="en"] .lernziel-chip { background: rgba(13,148,136,0.1); color: #0D9488; border-color: rgba(13,148,136,0.25); }
    [data-lang="en"] th { background: #0D9488; }
    [data-lang="en"] .lab-num { color: #0D9488; }
    [data-lang="en"] .nav-btn.primary { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .nav-btn.primary:hover { background: #0f766e; border-color: #0f766e; }
    [data-lang="en"] .tip-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .concept-box { border-left-color: #0D9488; background: rgba(13,148,136,0.08); }
    [data-lang="en"] .info-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .challenge-box { border-left-color: #0D9488; }
    [data-lang="en"] .step-number { background: #0D9488; }
    [data-lang="en"] .lernziele-box { border-left-color: #14B8A6; background: #F0FDFA; }
    [data-lang="en"] .lernziele-heading { color: #0D9488; }
    .quiz-option:hover:not(:disabled) { border-color: #2563EB; background: rgba(37,99,235,0.04); }
    [data-lang="en"] .quiz-option:hover:not(:disabled) { border-color: #0D9488; background: rgba(13,148,136,0.04); }
    [data-lang="en"] .footer { background: #0D9488; }

    .lernziele-box { background: #EFF6FF; border-left: 4px solid #2563EB; padding: 1.25rem 1.5rem; margin-top: 1.5rem; border-radius: 0 8px 8px 0; }
    .lernziele-heading { color: #1E3A8A; margin: 0 0 0.75rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── CodeBlock Component ──────────────────────────────────────────────────
    function CodeBlock({ code, lang, kind, note }) {
      const [copied, setCopied] = React.useState(false);
      const copy = () => {
        navigator.clipboard.writeText(code).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        }).catch(() => {
          const el = document.createElement('textarea');
          el.value = code;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        });
      };
      const labelCopy = lang === 'en' ? 'Copy' : 'Kopieren';
      const labelDone = lang === 'en' ? '\u2713 Copied' : '\u2713 Kopiert';
      return (
        <div style={{ position: 'relative', marginBottom: '1rem' }}>
          {kind && (
            <div className={'code-tag ' + (kind === 'run' ? 'code-tag-run' : 'code-tag-concept')}>
              {kind === 'run'
                ? (lang === 'en' ? 'Runnable as-is' : 'L\u00E4uft unver\u00E4ndert')
                : kind === 'diagram'
                  ? (lang === 'en' ? 'Schema \u2013 not code' : 'Schema \u2013 kein Code')
                  : (lang === 'en' ? 'Concept \u2013 placeholder names' : 'Konzept \u2013 Platzhalternamen')}
            </div>
          )}
          <pre className="code-block">{code}</pre>
          {note && <p className="code-note">{note}</p>}
          <button onClick={copy} style={{
            position: 'absolute', top: '0.5rem', right: '0.5rem',
            background: copied ? '#059669' : '#E5E7EB',
            color: copied ? 'white' : '#374151',
            border: 'none', borderRadius: '4px',
            padding: '0.2rem 0.5rem', fontSize: '0.75rem',
            cursor: 'pointer', fontFamily: 'Space Grotesk, sans-serif'
          }}>
            {copied ? labelDone : labelCopy}
          </button>
        </div>
      );
    }

    // ─── QuizQuestion Component ──────────────────────────────────────────────
    function QuizQuestion({ question, index, lang }) {
      // Mastery statt One-shot: falsche Antwort sperrt die Frage nicht mehr.
      const [selected, setSelected] = React.useState(null);
      const [revealed, setRevealed] = React.useState(false);
      const [attempts, setAttempts] = React.useState(0);
      const solved = selected === question.correct;
      const wrongPick = selected !== null && !solved;

      const pick = (oi) => {
        if (revealed) return;
        setSelected(oi);
        setAttempts((n) => n + 1);
        if (oi === question.correct) setRevealed(true);
      };

      return (
        <div style={{ marginBottom: '1.5rem', padding: '1.25rem', background: 'white', border: '1px solid #E5E7EB', borderRadius: '10px' }}>
          <p style={{ fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", margin: '0 0 0.75rem', color: '#1A1A1A' }}>
            {index + 1}. {question.q}
          </p>
          <div style={{ display: 'grid', gap: '0.5rem' }}>
            {question.options.map((opt, oi) => {
              let bg = 'white'; let border = '#D1D5DB'; let color = '#374151';
              if (revealed && oi === question.correct) { bg = '#D1FAE5'; border = '#059669'; color = '#065F46'; }
              else if (oi === selected && oi !== question.correct) { bg = '#FEE2E2'; border = '#DC2626'; color = '#991B1B'; }
              return (
                <button key={oi} disabled={revealed} onClick={() => pick(oi)}
                  className="quiz-option"
                  style={{
                    textAlign: 'left', padding: '0.6rem 1rem', fontSize: '0.88rem',
                    background: bg, border: '1.5px solid ' + border, borderRadius: '6px',
                    color, cursor: revealed ? 'default' : 'pointer',
                    fontFamily: 'inherit', transition: 'border-color 0.15s, background 0.15s'
                  }}>
                  {opt}
                </button>
              );
            })}
          </div>

          {wrongPick && !revealed && (
            <div className="quiz-hint">
              {lang === 'en'
                ? '\u2717 Not quite. Re-read the question and try again \u2013 or reveal the answer.'
                : '\u2717 Noch nicht richtig. Lies die Frage noch einmal und versuche es erneut \u2013 oder lass dir die L\u00F6sung zeigen.'}
            </div>
          )}

          {wrongPick && !revealed && (
            <div className="quiz-actions">
              <button type="button" className="quiz-retry-btn" onClick={() => setSelected(null)}>
                {lang === 'en' ? 'Try again' : 'Nochmal versuchen'}
              </button>
              <button type="button" className="quiz-retry-btn secondary" onClick={() => setRevealed(true)}>
                {lang === 'en' ? 'Show answer' : 'L\u00F6sung anzeigen'}
              </button>
              <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
            </div>
          )}

          {revealed && (
            <p style={{ marginTop: '0.5rem', fontSize: '0.85rem', fontWeight: 600, color: solved ? '#059669' : '#B45309' }}>
              {solved
                ? (lang === 'en' ? '\u2713 Correct!' : '\u2713 Richtig!')
                : (lang === 'en' ? 'Answer shown' : 'L\u00F6sung eingeblendet')}
            </p>
          )}
          {revealed && question.explanation && (
            <p style={{ marginTop: '0.35rem', fontSize: '0.85rem', lineHeight: 1.6, color: '#374151' }}>
              {question.explanation}
            </p>
          )}
          {revealed && (
            <div className="quiz-actions">
              <button type="button" className="quiz-retry-btn secondary"
                onClick={() => { setSelected(null); setRevealed(false); setAttempts(0); }}>
                {lang === 'en' ? 'Reset question' : 'Frage zur\u00FCcksetzen'}
              </button>
              {attempts > 1 && (
                <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
              )}
            </div>
          )}
        </div>
      );
    }

    // ─── Translations ─────────────────────────────────────────────────────────
    const translations = {
      de: {
        title: 'Fallstudie: Retail Analytics',
        desc: 'Kompletten BI-Workflow von Rohdaten bis Dashboard durchlaufen \u2013 parallel in Power BI und Python/Dash.',
        lernziele: [
          'Kompletten BI-Workflow durchlaufen',
          'Fallstudie in Power BI UND Python umsetzen',
          'Vor- und Nachteile beider Ans\u00E4tze erleben',
          'Professionelle KPI-Hierarchien entwerfen',
        ],
        navContents: 'Inhalt',
        nav: [
          { href: '#ueberblick',       label: '\u00DCberblick' },
          { href: '#datenerkundung',   label: '1: Datenerkundung' },
          { href: '#kpi-hierarchie',   label: '2: KPI-Hierarchie' },
          { href: '#powerbi-steps',    label: '3: Power BI' },
          { href: '#dash-steps',       label: '4: Plotly Dash' },
          { href: '#reflexion',        label: '5: Reflexion' },
          { href: '#ressourcen',       label: 'Ressourcen' },
          { href: '#quiz',             label: 'Quiz' },
          { href: '#zusammenfassung',  label: 'Zusammenfassung' },
        ],
        backLabel: '\u2190 \u00DCbersicht',

        s1Title: '\u00DCberblick',
        s1LernzieleLabel: 'Lernziele',
        s1InfoTitle: 'Datensatz',

      de: "-- 1. Kalendertabelle anlegen (Modellierung -> Neue Tabelle)\n--    Zeitintelligenz braucht eine lueckenlose, als Datumstabelle\n--    markierte Tabelle. Auto-Datum/Uhrzeit reicht dafuer nicht.\n\nDatum =\nVAR _min = MIN(Orders[Order Date])\nVAR _max = MAX(Orders[Order Date])\nRETURN\nADDCOLUMNS(\n    CALENDAR(DATE(YEAR(_min), 1, 1), DATE(YEAR(_max), 12, 31)),\n    \"Jahr\",        YEAR([Date]),\n    \"Monatsnr\",    MONTH([Date]),\n    \"Monat\",       FORMAT([Date], \"MMM\"),\n    \"Quartal\",     \"Q\" & QUARTER([Date])\n)\n\n-- 2. Danach im Menueband: Tabellentools -> Als Datumstabelle markieren\n--    -> Spalte [Date] waehlen. Anschliessend im Modell eine 1:n-Beziehung\n--    von Datum[Date] zu Orders[Order Date] ziehen.\n\n-- 3. Grundlegende Measures\n\nUmsatz =\nSUM(Orders[Sales])\n\nBestellungen =\nDISTINCTCOUNT(Orders[Order ID])\n\nPositionen =\nCOUNTROWS(Orders)\n\nAvg_Bestellwert =\nDIVIDE([Umsatz], [Bestellungen], 0)\n\n-- Zeitintelligenz laeuft ueber die Datumstabelle, nicht ueber Orders:\nUmsatz_VJ =\nCALCULATE([Umsatz], SAMEPERIODLASTYEAR(Datum[Date]))\n\nYoY_Wachstum =\nDIVIDE([Umsatz] - [Umsatz_VJ], [Umsatz_VJ], 0) * 100\n\n-- Sollwerte zur Kontrolle:\n-- Umsatz 2.261.536,78 | Bestellungen 4.922 | Positionen 9.800\n-- Avg_Bestellwert 459,48\n-- 2017: 600.192,55 | 2018: 722.052,02 | YoY_Wachstum 2018 ~ 20,3 %\n\n-- Hinweis: Der Datensatz enthaelt keine Kosten- oder Gewinnspalte.\n-- Deckungsbeitrags-Measures wie Gewinn oder Marge lassen sich damit\n-- nicht bilden; sie brauchen die Vollversion des Superstore-Datensatzes.",

      en: "-- 1. Create a calendar table (Modeling -> New table)\n--    Time intelligence needs a gap-free table that is marked as a\n--    date table. Auto date/time is not enough for this.\n\nDate_Table =\nVAR _min = MIN(Orders[Order Date])\nVAR _max = MAX(Orders[Order Date])\nRETURN\nADDCOLUMNS(\n    CALENDAR(DATE(YEAR(_min), 1, 1), DATE(YEAR(_max), 12, 31)),\n    \"Year\",        YEAR([Date]),\n    \"MonthNo\",     MONTH([Date]),\n    \"Month\",       FORMAT([Date], \"MMM\"),\n    \"Quarter\",     \"Q\" & QUARTER([Date])\n)\n\n-- 2. Then on the ribbon: Table tools -> Mark as date table\n--    -> pick column [Date]. Afterwards draw a 1:many relationship\n--    from Date_Table[Date] to Orders[Order Date] in the model.\n\n-- 3. Base measures\n\nRevenue =\nSUM(Orders[Sales])\n\nOrders_Count =\nDISTINCTCOUNT(Orders[Order ID])\n\nLineItems =\nCOUNTROWS(Orders)\n\nAvg_Order_Value =\nDIVIDE([Revenue], [Orders_Count], 0)\n\n-- Time intelligence runs through the date table, not through Orders:\nRevenue_PY =\nCALCULATE([Revenue], SAMEPERIODLASTYEAR(Date_Table[Date]))\n\nYoY_Growth =\nDIVIDE([Revenue] - [Revenue_PY], [Revenue_PY], 0) * 100\n\n-- Expected values for checking:\n-- Revenue 2,261,536.78 | Orders 4,922 | Line items 9,800\n-- Avg order value 459.48\n-- 2017: 600,192.55 | 2018: 722,052.02 | YoY growth 2018 ~ 20.3%\n\n-- Note: the dataset has no cost or profit column. Contribution-margin\n-- measures such as profit or margin cannot be built from it; they need\n-- the full version of the Superstore dataset.",

    };

    const CODE_DASH = {

      de: "# app.py – Superstore Retail Analytics Dashboard\nimport dash\nfrom dash import dcc, html, Input, Output\nimport plotly.express as px\nimport pandas as pd\n\napp = dash.Dash(__name__)\n\n# Daten laden und vorbereiten\ndf = pd.read_csv('train.csv', encoding='latin-1')\n# TT/MM/JJJJ -> dayfirst=True zwingend\ndf['Order Date'] = pd.to_datetime(df['Order Date'], dayfirst=True)\ndf['Month'] = df['Order Date'].dt.to_period('M').dt.to_timestamp()\n\n# Farben als Python-Konstanten (NICHT CSS-Variablen!)\n# Plotly rendert zu SVG/Canvas, nicht ins DOM –\n# var(--col-primary) funktioniert dort nicht.\nCOL_PRIMARY = '#1E3A8A'\nCOL_ACCENT  = '#2563EB'\n\napp.layout = html.Div([\n    # Header\n    html.Div([\n        html.H1('Superstore Analytics Dashboard',\n                style={'margin': '0', 'fontSize': '1.5rem'}),\n    ], style={'background': COL_PRIMARY, 'color': 'white',\n              'padding': '1rem 2rem'}),\n\n    # Filter\n    html.Div([\n        html.Div([\n            html.Label('Segment:'),\n            dcc.Dropdown(\n                id='segment-filter',\n                options=[{'label': s, 'value': s}\n                         for s in df['Segment'].unique()],\n                value=df['Segment'].unique().tolist(),\n                multi=True, clearable=False\n            ),\n        ], style={'flex': 1}),\n        html.Div([\n            html.Label('Region:'),\n            dcc.Dropdown(\n                id='region-filter',\n                options=[{'label': r, 'value': r}\n                         for r in df['Region'].unique()],\n                value=df['Region'].unique().tolist(),\n                multi=True, clearable=False\n            ),\n        ], style={'flex': 1}),\n    ], style={'display': 'flex', 'gap': '1rem',\n              'padding': '1rem 2rem', 'background': '#f8fafc'}),\n\n    # KPI Cards\n    html.Div(id='kpi-cards',\n             style={'display': 'grid',\n                    'gridTemplateColumns': 'repeat(4, 1fr)',\n                    'gap': '1rem', 'padding': '1rem 2rem'}),\n\n    # Charts\n    html.Div([\n        dcc.Graph(id='trend-chart'),\n        dcc.Graph(id='category-chart'),\n    ], style={'display': 'grid', 'gridTemplateColumns': '1fr 1fr',\n              'gap': '1rem', 'padding': '0 2rem 1rem'}),\n\n    dcc.Graph(id='scatter-chart',\n              style={'padding': '0 2rem 2rem'}),\n])\n\ndef kpi_card(title, value, color=COL_PRIMARY):\n    return html.Div([\n        html.Div(value, style={'fontSize': '1.75rem', 'fontWeight': '800',\n                               'color': color}),\n        html.Div(title, style={'fontSize': '0.75rem', 'color': '#6B7280',\n                               'textTransform': 'uppercase',\n                               'letterSpacing': '0.08em'}),\n    ], style={'background': 'white', 'padding': '1.25rem',\n              'border': '1px solid #e5e7eb',\n              'borderLeft': f'4px solid {color}'})\n\n@app.callback(\n    Output('kpi-cards', 'children'),\n    Output('trend-chart', 'figure'),\n    Output('category-chart', 'figure'),\n    Output('scatter-chart', 'figure'),\n    Input('segment-filter', 'value'),\n    Input('region-filter', 'value')\n)\ndef update_dashboard(segments, regions):\n    fdf = df[df['Segment'].isin(segments) &\n             df['Region'].isin(regions)]\n\n    # KPI Cards\n    total_sales = fdf['Sales'].sum()\n    orders = fdf['Order ID'].nunique()\n    positions = len(fdf)\n    avg_order = total_sales / orders if orders else 0\n\n    cards = [\n        kpi_card('Umsatz', f'${total_sales:,.0f}'),\n        kpi_card('Bestellungen', f'{orders:,}'),\n        kpi_card('\u00D8 Bestellwert', f'${avg_order:,.0f}', COL_ACCENT),\n        kpi_card('Positionen', f'{positions:,}'),\n    ]\n\n    # Trend\n    trend = fdf.groupby('Month')['Sales'].sum().reset_index()\n    fig1 = px.line(trend, x='Month', y='Sales',\n                   title='Umsatz-Trend (monatlich)',\n                   color_discrete_sequence=[COL_ACCENT])\n    fig1.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    # Kategorie\n    by_cat = fdf.groupby('Category')['Sales'].sum().reset_index()\n    fig2 = px.bar(by_cat, x='Category', y='Sales',\n                  title='Umsatz nach Kategorie',\n                  color_discrete_sequence=[COL_PRIMARY])\n    fig2.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    # Scatter\n    by_sub = fdf.groupby('Sub-Category').agg(\n        Sales=('Sales','sum'), Positionen=('Order ID','count')\n    ).reset_index()\n    fig3 = px.scatter(by_sub, x='Positionen', y='Sales',\n                      text='Sub-Category', size='Sales',\n                      title='Umsatz vs. Bestellpositionen nach Sub-Kategorie',\n                      color_discrete_sequence=[COL_ACCENT])\n    fig3.update_traces(textposition='top center')\n    fig3.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    return cards, fig1, fig2, fig3\n\nif __name__ == '__main__':\n    app.run(debug=True)",

       'gap': '1rem', 'padding': '1rem 2rem'}),\n\n    # Charts\n    html.Div([\n        dcc.Graph(id='trend-chart'),\n        dcc.Graph(id='category-chart'),\n    ], style={'display': 'grid', 'gridTemplateColumns': '1fr 1fr',\n              'gap': '1rem', 'padding': '0 2rem 1rem'}),\n\n    dcc.Graph(id='scatter-chart',\n              style={'padding': '0 2rem 2rem'}),\n])\n\ndef kpi_card(title, value, color=COL_PRIMARY):\n    return html.Div([\n        html.Div(value, style={'fontSize': '1.75rem', 'fontWeight': '800',\n                               'color': color}),\n        html.Div(title, style={'fontSize': '0.75rem', 'color': '#6B7280',\n                               'textTransform': 'uppercase',\n                               'letterSpacing': '0.08em'}),\n    ], style={'background': 'white', 'padding': '1.25rem',\n              'border': '1px solid #e5e7eb',\n              'borderLeft': f'4px solid {color}'})\n\n@app.callback(\n    Output('kpi-cards', 'children'),\n    Output('trend-chart', 'figure'),\n    Output('category-chart', 'figure'),\n    Output('scatter-chart', 'figure'),\n    Input('segment-filter', 'value'),\n    Input('region-filter', 'value')\n)\ndef update_dashboard(segments, regions):\n    fdf = df[df['Segment'].isin(segments) &\n             df['Region'].isin(regions)]\n\n    # KPI Cards\n    total_sales = fdf['Sales'].sum()\n    orders = fdf['Order ID'].nunique()\n    positions = len(fdf)\n    avg_order = total_sales / orders if orders else 0\n\n    cards = [\n        kpi_card('Revenue', f'${total_sales:,.0f}'),\n        kpi_card('Orders', f'{orders:,}'),\n        kpi_card('Avg order value', f'${avg_order:,.0f}', COL_ACCENT),\n        kpi_card('Line items', f'{positions:,}'),\n    ]\n\n    # Trend\n    trend = fdf.groupby('Month')['Sales'].sum().reset_index()\n    fig1 = px.line(trend, x='Month', y='Sales',\n                   title='Revenue trend (monthly)',\n                   color_discrete_sequence=[COL_ACCENT])\n    fig1.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    # Category\n    by_cat = fdf.groupby('Category')['Sales'].sum().reset_index()\n    fig2 = px.bar(by_cat, x='Category', y='Sales',\n                  title='Revenue by category',\n                  color_discrete_sequence=[COL_PRIMARY])\n    fig2.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    # Scatter\n    by_sub = fdf.groupby('Sub-Category').agg(\n        Sales=('Sales','sum'), LineItems=('Order ID','count')\n    ).reset_index()\n    fig3 = px.scatter(by_sub, x='LineItems', y='Sales',\n                      text='Sub-Category', size='Sales',\n                      title='Revenue vs. line items by sub-category',\n                      color_discrete_sequence=[COL_ACCENT])\n    fig3.update_traces(textposition='top center')\n    fig3.update_layout(plot_bgcolor='white', paper_bgcolor='white')\n\n    return cards, fig1, fig2, fig3\n\nif __name__ == '__main__':\n    app.run(debug=True)",

                  <div key={i} style={{
                    marginBottom: i < tx.s7Resources.length - 1 ? '1.25rem' : 0,
                    paddingBottom: i < tx.s7Resources.length - 1 ? '1.25rem' : 0,
                    borderBottom: i < tx.s7Resources.length - 1 ? '1px solid #FED7AA' : 'none'
                  }}>
                    <a href={res.url} target="_blank" rel="noopener noreferrer" className="youtube-link">{res.title}</a>
                    <p style={{ margin: '0.25rem 0 0', fontSize: '0.875rem', color: '#78350F' }}>{res.desc}</p>
                  </div>
                ))}
              </div>
              {/* Book reference */}
              <div className="info-box" style={{ marginTop: '1.25rem' }}>
                <p style={{ margin: 0, fontSize: '0.875rem' }}>{tx.s7BookRef}</p>
              </div>
            </section>

            {/* ── Section 8: Quiz ── */}
            <section id="quiz" className="section-block">
              <h2>{tx.quizTitle}</h2>
              <div className="bauhaus-accent-line"></div>
              {tx.quizQuestions.map((qq, qi) => (
                <QuizQuestion key={qi} question={qq} index={qi} lang={lang} />
              ))}
            </section>

            {/* ── Section 9: Zusammenfassung ── */}
            <section id="zusammenfassung" className="section-block">
              <h2>{tx.summaryTitle}</h2>
              <div className="bauhaus-accent-line"></div>
              <div className="concept-box">
                <ol style={{ margin: 0, paddingLeft: '1.25rem' }}>
                  {tx.summaryItems.map((item, i) => (
                    <li key={i} style={{ fontSize: '0.9rem', lineHeight: 1.7, color: '#1A1A1A', marginBottom: '0.35rem' }}>{item}</li>
                  ))}
                </ol>
              </div>
            </section>

            {/* ── Nav Bottom ── */}
            <div className="nav-bottom">
              <a href={'lab-04-dashboards.html' + (lang === 'en' ? '?lang=en' : '')} className="nav-btn">
                {tx.navPrev}
              </a>
              <a href={'lab-06-souveraenitaet.html' + (lang === 'en' ? '?lang=en' : '')} className="nav-btn primary">
                {tx.navNext}
              </a>
            </div>

          </main>

          {/* Footer */}
          <footer className="footer">
            {'THWS Business School \u00B7 BI Lab \u00B7 Prof. Dr. Robert Butscher \u00B7 2026'}
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
