<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 06 – Digitale Souveränität &amp; Open-Source BI · THWS BI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React 18.3.1 (UMD). Bewusst NICHT React 19: React 19 liefert keine UMD-Builds mehr,
       die dieses build-freie Setup (Transpilierung per text/babel im Browser) voraussetzt. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <!-- Babel bewusst auf 7.x gepinnt: Babel 8 stellt auf den automatic JSX runtime um
       und bricht damit text/babel ohne Bundler. 7.29.8 = letzter 7.x-Stand. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"
          integrity="sha384-Ux6uBqExf/7ahsSNrA9VI7vuaw6sKjDoVdjdUxmIoL2qdlzFVZ157sTi6JK3Z9Q8" crossorigin="anonymous"></script>
  <style>
    :root {

    [data-lang="en"] {
      --col-primary: #0D9488;
      --col-accent: #0D9488;
      --col-primary-light: rgba(13,148,136,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #FAFAFA; font-family: 'Space Grotesk', -apple-system, sans-serif; margin: 0; color: #1A1A1A; }
    h2 { color: #1E3A8A; font-weight: 800; font-family: 'Space Grotesk', sans-serif; margin-top: 0; }

    p { line-height: 1.7; }
    .lab-num { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 3.5rem; color: #1E3A8A; opacity: 0.12; position: absolute; right: 0; top: -0.75rem; }
    .bauhaus-accent-line { width: 48px; height: 4px; background: #2563EB; margin: 0.5rem 0 1rem 0; }
    .bauhaus-badge { background: #2563EB; color: white; padding: 0.2rem 0.7rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; }
    .code-block { background: #F3F4F6; color: #1A1A1A; border-left: 4px solid #D1D5DB; font-family: 'Courier New', monospace; font-size: 0.82rem; padding: 1rem 1.25rem; border-radius: 0 8px 8px 0; white-space: pre; overflow-x: auto; position: relative; margin: 1rem 0; }
    .tip-box { border-left: 4px solid #2563EB; background: #EFF6FF; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .info-box { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .concept-box { border-left: 4px solid #1E3A8A; background: rgba(30,58,138,0.06); padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .challenge-box { border-left: 4px solid #22c55e; background: #f0fdf4; padding: 1rem 1.25rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .youtube-box { background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 10px; padding: 1.5rem; margin: 1rem 0; }
    .youtube-box h4 { color: #EA580C; margin-top: 0; }
    .youtube-link { color: #EA580C; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .youtube-link:hover { text-decoration: underline; }
    .step-number { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #1E3A8A; color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1rem; flex-shrink: 0; margin-right: 0.75rem; }
    .step-block { display: flex; align-items: flex-start; margin-bottom: 1.5rem; }

    .lang-btn.active { background: #1E3A8A; color: white; border-color: #1E3A8A; }
    .lang-btn:hover:not(.active) { background: #f5f5f5; }

    .sidebar-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #888; padding: 0 1.25rem; margin-bottom: 0.75rem; }
    .sidebar-link { display: block; padding: 0.55rem 1.25rem; font-size: 0.88rem; color: #444; text-decoration: none; border-left: 3px solid transparent; transition: background 0.12s, color 0.12s, border-color 0.12s; font-weight: 500; }
    .sidebar-link:hover { color: #1E3A8A; background: rgba(30,58,138,0.04); }
    .sidebar-link.active { color: #1E3A8A; border-left-color: #2563EB; background: rgba(30,58,138,0.06); font-weight: 700; }
    .main-content { margin-left: 260px; padding-top: 72px; padding-bottom: 4rem; padding-left: 3rem; padding-right: 3rem; max-width: 960px; }
    .section-block { margin-bottom: 4rem; }
    .lernziele-box { background: #EFF6FF; border-left: 4px solid #2563EB; padding: 1.25rem 1.5rem; margin-top: 1.5rem; }
    .lernziele-heading { color: #1E3A8A; margin: 0 0 0.75rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .lernziel-chip { display: inline-block; background: rgba(30,58,138,0.08); color: #1E3A8A; border: 1px solid rgba(30,58,138,0.2); padding: 0.3rem 0.7rem; border-radius: 999px; font-size: 0.82rem; font-weight: 500; margin: 0.2rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    /* ── Kennzeichnung kopierbarer Codebloecke ───────────────────────────────
       Jeder Block sagt, ob er in einer frischen Umgebung so laeuft ("run")
       oder ob er ein Konzeptsnippet mit Platzhalternamen ist ("concept"). */
    .code-tag { display: inline-block; font-family: 'Space Grotesk', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.25rem 0.65rem; border-radius: 5px 5px 0 0; }
    .code-tag-run { background: #065F46; color: #fff; }
    .code-tag-concept { background: #92400E; color: #fff; }
    .code-tag + .code-block { border-radius: 0 8px 8px 0; margin-top: 0; }
    .code-note { font-size: 0.78rem; color: #4B5563; margin: 0.35rem 0 0; line-height: 1.55; }
    /* ── Quiz: zweiter Versuch statt Einmal-Sperre ───────────────────────────
       Eine falsche Antwort sperrt die Frage nicht mehr. Die Loesung wird erst
       gezeigt, wenn sie getroffen oder ausdruecklich angefordert wurde. */
    .quiz-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .quiz-retry-btn { font-family: inherit; font-size: 0.82rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1.5px solid var(--col-primary, #1E3A8A); background: white; color: var(--col-primary, #1E3A8A); cursor: pointer; }
    .quiz-retry-btn:hover { background: rgba(30,58,138,0.06); }
    .quiz-retry-btn.secondary { border-color: #9CA3AF; color: #4B5563; }
    .quiz-retry-btn.secondary:hover { background: #F3F4F6; }
    .quiz-hint { margin-top: 0.6rem; font-size: 0.85rem; line-height: 1.6; color: #92400E; background: #FFFBEB; border-left: 3px solid #F59E0B; padding: 0.55rem 0.9rem; border-radius: 0 6px 6px 0; }
    .quiz-attempts { font-size: 0.78rem; color: #6B7280; align-self: center; }
    /* ── Responsive Guards (Mobilnutzung) ────────────────────────────────────
       Tabellen und Codebloecke duerfen breiter sein als der Viewport, aber sie
       scrollen dann in ihrem eigenen Container. Die Seite selbst scrollt nie
       horizontal. Pruefwert: document.scrollWidth <= window.innerWidth bei
       320 / 390 / 768 / 1024 / 1440 px. */
    .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0; }
    .table-wrap > table { margin: 0; }
    /* Flex- und Grid-Kinder duerfen unter ihre Inhaltsbreite schrumpfen,
       sonst sprengt ein <pre> den Elternteil (min-width:auto ist der Default). */
    .step-content, .step-block > * { min-width: 0; }
    .section-block, .content, main { min-width: 0; }
    .code-block { max-width: 100%; }
    /* Lange Bezeichner ohne Leerzeichen (Spaltennamen, URLs) umbrechen lassen. */
    p, li, td, th, h1, h2, h3, h4 { overflow-wrap: break-word; }
    code { overflow-wrap: anywhere; word-break: break-word; }
    .tip-box, .info-box, .concept-box, .challenge-box, .youtube-box { max-width: 100%; overflow-wrap: break-word; }
    th { background: #1E3A8A; color: white; padding: 0.65rem 1rem; text-align: left; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.05em; }
    td { padding: 0.6rem 1rem; border-bottom: 1px solid #e5e7eb; }
    tr:nth-child(even) td { background: #f9fafb; }
    .nav-bottom { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; margin-top: 2rem; border-top: 1px solid #e5e7eb; }
    .nav-btn { border: 2px solid #1A1A1A; background: white; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; color: #1A1A1A; font-family: 'Space Grotesk', sans-serif; display: inline-block; }
    .nav-btn:hover { background: #2563EB; color: white; border-color: #2563EB; }
    .nav-btn.primary { background: #1E3A8A; border-color: #1E3A8A; color: white; }
    .nav-btn.primary:hover { background: #1e40af; border-color: #1e40af; }
    .footer { background: #1A1A1A; padding: 2rem 3rem 2rem calc(260px + 3rem); }
    .footer-text { color: #6B7280; font-size: 0.875rem; }
    .checklist-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #F3F4F6; }
    .checklist-check { width: 20px; height: 20px; border: 2px solid #D1D5DB; border-radius: 4px; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: background 0.15s, border-color 0.15s; display: flex; align-items: center; justify-content: center; }
    .checklist-check.checked { background: #2563EB; border-color: #2563EB; }
    .checklist-text { font-size: 0.95rem; color: #374151; padding-top: 1px; }
    .checklist-text.done { text-decoration: line-through; color: #9CA3AF; }
    .quiz-option { display: block; width: 100%; text-align: left; padding: 0.75rem 1rem; margin: 0.4rem 0; border: 2px solid #E5E7EB; border-radius: 8px; background: white; font-size: 0.92rem; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: border-color 0.15s, background 0.15s; }
    .quiz-option:hover:not(:disabled) { border-color: #2563EB; background: rgba(37,99,235,0.04); }
    @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding-left: 1.25rem; padding-right: 1.25rem; } .footer { padding: 2rem 1.25rem; } }
    [data-lang="en"] h2, [data-lang="en"] h3 { color: #0D9488; }
    [data-lang="en"] h4 { color: #0D9488; }
    [data-lang="en"] .bauhaus-accent-line { background: #14B8A6; }
    [data-lang="en"] .bauhaus-badge { background: #0D9488; }
    [data-lang="en"] .header-logo { color: #0D9488; }
    [data-lang="en"] .header-back:hover { color: #0D9488; }
    [data-lang="en"] .lang-btn.active { background: #0D9488; border-color: #0D9488; color: white; }
    [data-lang="en"] .sidebar-link:hover { color: #0D9488; background: rgba(13,148,136,0.04); }
    [data-lang="en"] .sidebar-link.active { color: #0D9488; border-left-color: #0D9488; background: rgba(13,148,136,0.06); font-weight: 700; }
    [data-lang="en"] .lernziele-box { border-left-color: #14B8A6; background: #F0FDFA; }
    [data-lang="en"] .lernziele-heading { color: #0D9488; }
    [data-lang="en"] .lernziel-chip { background: rgba(13,148,136,0.1); color: #0D9488; border-color: rgba(13,148,136,0.25); }
    [data-lang="en"] .lab-num { color: #0D9488; }
    [data-lang="en"] th { background: #0D9488; }
    [data-lang="en"] .tip-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .concept-box { border-left-color: #0D9488; background: rgba(13,148,136,0.08); }
    [data-lang="en"] .info-box { border-left-color: #0D9488; background: #F0FDFA; }
    [data-lang="en"] .step-number { background: #0D9488; }
    [data-lang="en"] .checklist-check.checked { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .nav-btn:hover { background: #0D9488; border-color: #0D9488; color: white; }
    [data-lang="en"] .nav-btn.primary { background: #0D9488; border-color: #0D9488; }
    [data-lang="en"] .nav-btn.primary:hover { background: #0f766e; border-color: #0f766e; }
    [data-lang="en"] .quiz-option:hover:not(:disabled) { border-color: #0D9488; background: rgba(13,148,136,0.04); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  function CodeBlock({ code, lang, kind, note }) {
    const [copied, setCopied] = React.useState(false);
    const copyLabel = lang === 'en' ? 'Copy' : 'Kopieren';
    const copiedLabel = lang === 'en' ? '\u2713 Copied' : '\u2713 Kopiert';
    const copy = () => {
      navigator.clipboard.writeText(code).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      }).catch(() => {
        const el = document.createElement('textarea');
        el.value = code;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    };
    return (
      <div style={{ position: 'relative', marginBottom: '1rem' }}>
        {kind && (
          <div className={'code-tag ' + (kind === 'run' ? 'code-tag-run' : 'code-tag-concept')}>
            {kind === 'run'
              ? (lang === 'en' ? 'Runnable as-is' : 'L\u00E4uft unver\u00E4ndert')
              : kind === 'diagram'
                ? (lang === 'en' ? 'Schema \u2013 not code' : 'Schema \u2013 kein Code')
                : (lang === 'en' ? 'Concept \u2013 placeholder names' : 'Konzept \u2013 Platzhalternamen')}
          </div>
        )}
        <pre className="code-block">{code}</pre>
        {note && <p className="code-note">{note}</p>}
        <button onClick={copy} style={{ position: 'absolute', top: '0.5rem', right: '0.5rem', background: copied ? '#059669' : '#E5E7EB', color: copied ? 'white' : '#374151', border: 'none', padding: '0.2rem 0.5rem', fontSize: '0.75rem', cursor: 'pointer', fontFamily: 'Space Grotesk, sans-serif' }}>{copied ? copiedLabel : copyLabel}</button>
      </div>
    );
  }

  function ChecklistItem({ text, checked, onToggle }) {
    return (
      <div className="checklist-item">
        <div
          className={'checklist-check' + (checked ? ' checked' : '')}
          onClick={onToggle}
          role="checkbox"
          aria-checked={checked}
          tabIndex={0}
          onKeyDown={(e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onToggle(); } }}
        >
          {checked && (
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2 6l3 3 5-5" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          )}
        </div>
        <span className={'checklist-text' + (checked ? ' done' : '')}>{text}</span>
      </div>
    );
  }

  function QuizQuestion({ question, index, lang }) {
    // Mastery statt One-shot: falsche Antwort sperrt die Frage nicht mehr.
    const [selected, setSelected] = React.useState(null);
    const [revealed, setRevealed] = React.useState(false);
    const [attempts, setAttempts] = React.useState(0);
    const solved = selected === question.correct;
    const wrongPick = selected !== null && !solved;

    const handleClick = (i) => {
      if (revealed) return;
      setSelected(i);
      setAttempts((n) => n + 1);
      if (i === question.correct) setRevealed(true);
    };

    return (
      <div style={{ marginBottom: '1.75rem' }}>
        <p style={{ fontWeight: 600, marginBottom: '0.5rem' }}>{index}. {question.q}</p>
        {question.options.map((opt, i) => {
          let style = {};
          if (revealed && i === question.correct) style = { borderColor: '#059669', background: '#F0FDF4', color: '#065F46' };
          else if (i === selected && i !== question.correct) style = { borderColor: '#DC2626', background: '#FEF2F2', color: '#991B1B' };
          return (
            <button key={i} className="quiz-option" disabled={revealed} onClick={() => handleClick(i)} style={style}>
              {String.fromCharCode(65 + i)}) {opt}
            </button>
          );
        })}

        {wrongPick && !revealed && (
          <div className="quiz-hint">
            {lang === 'en'
              ? '\u2717 Not quite. Re-read the question and try again \u2013 or reveal the answer.'
              : '\u2717 Noch nicht richtig. Lies die Frage noch einmal und versuche es erneut \u2013 oder lass dir die L\u00F6sung zeigen.'}
          </div>
        )}

        {wrongPick && !revealed && (
          <div className="quiz-actions">
            <button type="button" className="quiz-retry-btn" onClick={() => setSelected(null)}>
              {lang === 'en' ? 'Try again' : 'Nochmal versuchen'}
            </button>
            <button type="button" className="quiz-retry-btn secondary" onClick={() => setRevealed(true)}>
              {lang === 'en' ? 'Show answer' : 'L\u00F6sung anzeigen'}
            </button>
            <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
          </div>
        )}

        {revealed && (
          <div style={{ marginTop: '0.5rem', padding: '0.75rem 1rem', background: solved ? '#F0FDF4' : '#FFFBEB', borderRadius: '8px', fontSize: '0.88rem', color: solved ? '#065F46' : '#92400E' }}>
            {!solved && (lang === 'en' ? 'Answer shown. ' : 'L\u00F6sung eingeblendet. ')}{question.explanation}
          </div>
        )}
        {revealed && (
          <div className="quiz-actions">
            <button type="button" className="quiz-retry-btn secondary"
              onClick={() => { setSelected(null); setRevealed(false); setAttempts(0); }}>
              {lang === 'en' ? 'Reset question' : 'Frage zur\u00FCcksetzen'}
            </button>
            {attempts > 1 && (
              <span className="quiz-attempts">{(lang === 'en' ? 'Attempts: ' : 'Versuche: ') + attempts}</span>
            )}
          </div>
        )}
      </div>
    );
  }

  function App() {
    const urlLang = new URLSearchParams(window.location.search).get('lang');
    const [lang, setLang] = React.useState(() => urlLang || localStorage.getItem('bi-lang') || 'de');
    const toggleLang = (l) => { setLang(l); localStorage.setItem('bi-lang', l); };

    const [activeSection, setActiveSection] = React.useState('ueberblick');

    const checklistCount = 8;
    // Fortschritt in localStorage sichern - ein Reload darf die Checkliste nicht zuruecksetzen.
    const [checkedItems, setCheckedItems] = React.useState(() => {
      try {
        const saved = JSON.parse(localStorage.getItem('bi-lab06-dsgvo') || 'null');
        if (Array.isArray(saved) && saved.length === checklistCount) return saved.map(Boolean);
      } catch (e) { /* defekter Eintrag -> sauber neu anfangen */ }
      return new Array(checklistCount).fill(false);
    });
    React.useEffect(() => {
      try { localStorage.setItem('bi-lab06-dsgvo', JSON.stringify(checkedItems)); } catch (e) {}
    }, [checkedItems]);
    const toggleCheck = (i) => {
      setCheckedItems((prev) => {
        const next = prev.slice();
        next[i] = !next[i];
        return next;
      });
    };
    const resetChecklist = () => setCheckedItems(new Array(checklistCount).fill(false));

    React.useEffect(() => {
      document.documentElement.setAttribute('data-lang', lang);
    }, [lang]);

    React.useEffect(() => {
      const sections = ['ueberblick', 'souveraenitaet', 'lock-in', 'opensource', 'docker', 'dsgvo', 'entscheidung', 'abschlussprojekt', 'youtube', 'quiz', 'zusammenfassung'];
      const handleScroll = () => {
        let current = 'ueberblick';
        for (let i = 0; i < sections.length; i++) {
          const el = document.getElementById(sections[i]);
          if (el) {
            const rect = el.getBoundingClientRect();
            if (rect.top <= 100) current = sections[i];
          }
        }
        setActiveSection(current);
      };
      window.addEventListener('scroll', handleScroll, { passive: true });
      return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    const t = {
      de: {
        logo: 'THWS BI Lab',

          <section id="youtube" className="section-block">
            <h2>{c.s9Title}</h2>
            <div className="bauhaus-accent-line"></div>
            <p>{c.s9Intro}</p>
            <div className="youtube-box">
              {c.s9Resources.map((res, i) => (
                <div key={i} style={{ marginBottom: i < c.s9Resources.length - 1 ? '1.25rem' : 0 }}>
                  <h4 style={{ marginTop: 0 }}>{res.title}</h4>
                  <p style={{ margin: '0.25rem 0 0.5rem', color: '#78350F', fontSize: '0.875rem' }}>{res.desc}</p>
                  <a href={res.url} target="_blank" rel="noopener noreferrer" className="youtube-link">{res.label}</a>
                </div>
              ))}
            </div>
            <div className="info-box" style={{ marginTop: '1.25rem' }}>
              <p style={{ margin: 0, fontSize: '0.875rem' }}>{c.s9BookRef}</p>
            </div>
          </section>

          {/* 10 – Quiz */}
          <section id="quiz" className="section-block">
            <h2>{c.quizTitle}</h2>
            <div className="bauhaus-accent-line"></div>
            <p>{c.quizIntro}</p>
            {c.quizQuestions.map((q, i) => (
              <QuizQuestion key={i} question={q} index={i + 1} lang={lang} />
            ))}
          </section>

          {/* 11 – Zusammenfassung */}
          <section id="zusammenfassung" className="section-block">
            <h2>{c.sumTitle}</h2>
            <div className="bauhaus-accent-line"></div>
            <ol style={{ paddingLeft: '1.25rem', lineHeight: '2.2' }}>
              {c.sumItems.map((item, i) => <li key={i}>{item}</li>)}
            </ol>
          </section>

          <div className="nav-bottom">
            <a href={c.navBackHref} className="nav-btn">{c.navBack}</a>
          </div>
        </main>

        <footer className="footer">
          <p className="footer-text">{c.footer}</p>
        </footer>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
