      - heading "KPI-Konzepte" [level=2] [ref=f60e118]
      - heading "Was ist eine KPI?" [level=3] [ref=f60e120]
      - paragraph [ref=f60e122]: Ein Key Performance Indicator (KPI) ist eine messbare Kennzahl, die den Fortschritt eines Unternehmens in Bezug auf strategische Ziele quantifiziert.
      - heading "Arten von KPIs" [level=3] [ref=f60e123]
      - generic [ref=f60e124]:
        - generic [ref=f60e125]:
          - heading "Quantitativ" [level=4] [ref=f60e126]
          - generic [ref=f60e127]: Numerisch messbar
          - generic [ref=f60e128]: Umsatz in €, Anzahl Bestellungen
        - generic [ref=f60e129]:
          - heading "Qualitativ" [level=4] [ref=f60e130]
          - generic [ref=f60e131]: Einschätzung oder Bewertung
          - generic [ref=f60e132]: Kundenzufriedenheit (Score 1–5)
        - generic [ref=f60e133]:
          - heading "Absolut" [level=4] [ref=f60e134]
          - generic [ref=f60e135]: Absolutwert ohne Bezugsgröße
          - generic [ref=f60e136]: Gesamtumsatz 1,2 Mio. €
        - generic [ref=f60e137]:
          - heading "Relativ" [level=4] [ref=f60e138]
          - generic [ref=f60e139]: Verhältnis oder Veränderungsrate
          - generic [ref=f60e140]: Umsatzwachstum +12 %
      - heading "Lead vs. Lag Indicators" [level=3] [ref=f60e141]
      - paragraph [ref=f60e143]: Lead Indicators sind vorausschauende KPIs, die künftige Entwicklungen anzeigen (z. B. Anzahl Neukundenanfragen). Lag Indicators sind rückblickende KPIs, die vergangene Ergebnisse messen (z. B. Quartalsumsatz).
