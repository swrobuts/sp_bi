      - generic [ref=f60e253]:
        - 'heading "Einordnung: Power BI und Microsoft Fabric" [level=4] [ref=f60e254]'
        - paragraph [ref=f60e255]: "Seit 2023 ist Power BI Teil von Microsoft Fabric – einer SaaS-Plattform, die Datenintegration (Data Factory), Data Engineering (Spark), Data Warehouse, Real-Time Analytics und Power BI unter einem gemeinsamen Speicher namens OneLake zusammenfasst. Für die Lehre wichtig: Power BI Desktop und Power BI Pro funktionieren unverändert weiter – alles in diesem Kurs bleibt gültig. Geändert hat sich das Kapazitätsmodell: Die früheren Premium-Kapazitäten (P1–P5) werden zum Ende der jeweiligen Vertragslaufzeit durch Fabric-Kapazitäten (F-SKUs) ersetzt (P1→F64, P2→F128 usw.). Die entscheidende Schwelle ist F64: erst ab dieser Größe dürfen Berichte von Nutzern mit kostenloser Lizenz gelesen werden – darunter braucht jeder Betrachter eine Pro- oder PPU-Lizenz. Aus Souveränitätssicht verschärft Fabric das Lock-in: OneLake ist der gemeinsame Speicher aller Workloads, und je mehr Pipelines, Modelle und Notebooks dort liegen, desto teurer wird ein Ausstieg."
      - generic [ref=f60e256]:
        - heading "Hinweis zur Datensouveränität" [level=4] [ref=f60e257]
        - paragraph [ref=f60e258]: "Open-Source-Tools wie Apache Superset und Metabase ermöglichen self-hosted Betrieb. Das ist eine wichtige Voraussetzung für Datensouveränität – es entfällt der Drittlandtransfer und der AVV mit einem Cloud-Anbieter. DSGVO-Konformität entsteht dadurch aber nicht automatisch: Rechtsgrundlage, Verarbeitungsverzeichnis (Art. 30), TOMs (Art. 32) und Betroffenenrechte sind unabhängig vom Hosting-Modell zu erfüllen. In Lab 06 vertiefen wir das."
