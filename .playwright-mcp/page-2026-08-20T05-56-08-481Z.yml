      - generic [ref=f60e24]:
        - generic [ref=f60e25]: Definition
        - paragraph [ref=f60e26]: Business Intelligence (BI) bezeichnet Systeme und Prozesse zur Sammlung, Integration, Analyse und Visualisierung von Geschäftsdaten mit dem Ziel, datenbasierte Entscheidungen zu unterstützen.
      - generic [ref=f60e27]: Der Begriff „Business Intelligence" wurde 1958 von Hans Peter Luhn (IBM) geprägt. Er beschrieb damit die Fähigkeit, Zusammenhänge aus Daten zu erkennen und Handlungsempfehlungen abzuleiten.
