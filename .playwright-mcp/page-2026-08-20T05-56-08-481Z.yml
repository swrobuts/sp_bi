    - generic [ref=f60e320]:
      - generic [ref=f60e321]: ZUSAMMENFASSUNG
      - heading "Zusammenfassung" [level=2] [ref=f60e323]
      - list [ref=f60e325]:
        - listitem [ref=f60e326]: Business Intelligence (BI) wurde 1958 von Hans Peter Luhn (IBM) geprägt und bezeichnet die systematische Sammlung, Integration, Analyse und Visualisierung von Geschäftsdaten zur Entscheidungsunterstützung.
        - listitem [ref=f60e327]: BI grenzt sich von Diagnostic Analytics (Warum?), Data Science (Was wird passieren?) und Prescriptive Analytics (Was sollen wir tun?) ab – jede Disziplin hat eigene Werkzeuge und Fragestellungen.
        - listitem [ref=f60e328]: "Die BI-Architektur besteht aus fünf Schichten: Datenquellen → ETL/ELT (z. B. dbt, Airbyte) → Data Warehouse (Snowflake, BigQuery) → Semantic Layer / BI-Tool → Dashboard."
        - listitem [ref=f60e329]: Moderne Konzepte wie Data Lakehouse (Databricks) vereinen die Vorteile von Data Warehouse und Data Lake in einer Plattform.
        - listitem [ref=f60e330]: KPIs werden nach Typ (quantitativ/qualitativ, absolut/relativ) und Zeitrichtung (Lead = vorausschauend, Lag = rückblickend) klassifiziert. Gute KPIs folgen dem SMART-Prinzip.
        - listitem [ref=f60e331]: Der BI-Markt teilt sich in kommerzielle Lösungen (Power BI seit 2015, Tableau, Looker, Qlik) und Open-Source-Alternativen (Apache Superset, Metabase, Plotly Dash) mit voller Datenhoheit.
        - listitem [ref=f60e332]: "Power BI ist seit 2023 Teil von Microsoft Fabric: Die früheren Premium-Kapazitäten (P1–P5) weichen Fabric-F-SKUs, gemeinsamer Speicher ist OneLake. Ab F64 dürfen Nutzer mit kostenloser Lizenz Berichte lesen – unterhalb braucht jeder Betrachter Pro oder PPU."
        - listitem [ref=f60e333]: Bill Inmon (1992) und Ralph Kimball (1996) begründeten das Data Warehousing – die Grundlage moderner BI-Architektur.
