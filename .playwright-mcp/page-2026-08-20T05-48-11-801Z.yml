          - generic [ref=e95]:
            - generic [ref=e96]: "-- Grundlegende Measures Umsatz = SUM(Orders[Sales]) Bestellungen = DISTINCTCOUNT(Orders[Order ID]) Positionen = COUNTROWS(Orders) Avg_Bestellwert = DIVIDE([Umsatz], [Bestellungen], 0) Umsatz_VJ = CALCULATE([Umsatz], SAMEPERIODLASTYEAR(Orders[Order Date])) YoY_Wachstum = DIVIDE([Umsatz] - [Umsatz_VJ], [Umsatz_VJ], 0) * 100 -- Hinweis: Der Datensatz enthaelt keine Kosten- oder Gewinnspalte. -- Deckungsbeitrags-Measures wie Gewinn oder Marge lassen sich damit -- nicht bilden; sie brauchen die Vollversion des Superstore-Datensatzes."
