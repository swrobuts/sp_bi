<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BI Lab · Modul Business Intelligence · THWS Business School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS 2 wurde entfernt: keine einzige Tailwind-Utility-Klasse wurde benutzt
       (alle Klassen sind eigene, unten definierte Klassen). Die 2,9 MB Datei lieferte faktisch
       nur zwei Defaults aus dem Preflight-Reset, die jetzt unten explizit gesetzt sind:
       body { line-height: 1.5 } und der border-style-Default. Die Lab-Seiten laden Tailwind
       ohnehin nicht - damit sind alle sieben Seiten jetzt konsistent. -->
  <!-- React 18.3.1 (UMD). Bewusst NICHT React 19: React 19 liefert keine UMD-Builds mehr,
       die dieses build-freie Setup (Transpilierung per text/babel im Browser) voraussetzt. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <!-- Babel bewusst auf 7.x gepinnt: Babel 8 stellt auf den automatic JSX runtime um
       und bricht damit text/babel ohne Bundler. 7.29.8 = letzter 7.x-Stand. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"
          integrity="sha384-Ux6uBqExf/7ahsSNrA9VI7vuaw6sKjDoVdjdUxmIoL2qdlzFVZ157sTi6JK3Z9Q8" crossorigin="anonymous"></script>

  <style>
    /* DESIGN DECISION: Bilingual color scheme
       DE mode: Navy #1E3A8A (primary brand color)
       EN mode: Teal #0D9488 (alternative accent)
       The language toggle intentionally switches the entire color palette. */

    :root {
      --primary: #1E3A8A;
      --accent: #2563EB;
      --dark: #1A1A1A;
      --light-bg: #FAFAFA;
      --primary-light: rgba(30,58,138,0.08);
    }

    /* Ersetzt die beiden einzigen Defaults, die vorher aus Tailwinds Preflight kamen. */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      border-width: 0; border-style: solid; border-color: currentColor;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #FFFFFF;
      color: var(--dark);
      line-height: 1.5;
    }

    h2 { color: #1E3A8A; font-weight: 800; font-family: 'Space Grotesk', sans-serif; }
    h3 { color: #1E3A8A; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    a { color: var(--primary); }
    button { transition: all 0.2s ease; }

    .bauhaus-accent-line {
      width: 48px;
      height: 4px;
      background: #2563EB;
      margin: 0.5rem 0 1rem 0;
    }

    .bauhaus-badge {
      background: #2563EB;
      color: white;
      padding: 0.2rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 0;
      display: inline-block;
    }

    /* Geometric background animations */
    @keyframes floatCircle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }
    @keyframes floatSquare {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(20px) rotate(8deg); }
    }

    .geo-circle {
      position: absolute;
      width: 420px; height: 420px;
      border-radius: 50%;
      opacity: 0.15;
      top: -80px; right: -100px;
      animation: floatCircle 8s ease-in-out infinite;
      pointer-events: none;
    }
    .geo-square {
      position: absolute;
      width: 260px; height: 260px;
      opacity: 0.2;
      bottom: -60px; left: -60px;
      animation: floatSquare 10s ease-in-out infinite;
      pointer-events: none;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      height: 56px;
      background: white;
      border-bottom: 1px solid #E5E7EB;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }

    /* Lang toggle */
    .lang-btn {
      padding: 0.25rem 0.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      background: transparent;
      color: #1A1A1A;
      transition: background 0.15s, color 0.15s;
    }
    .lang-btn.active {
      background: #1E3A8A;
      color: white;
      border-color: #1E3A8A;
    }
    .lang-btn:hover:not(.active) { background: #f5f5f5; }

    /* Hero */
    .hero {
      background: #1E3A8A;
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 3rem;
      overflow: hidden;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3.5rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-tag {
      border: 1.5px solid rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.85);
      padding: 0.25rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .hero-eyebrow {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 1rem;
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 12rem;
      color: white;
      line-height: 0.95;
      margin-bottom: 0.5rem;
    }
    .hero-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      font-size: 2.6rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 1.25rem;
      letter-spacing: 0.02em;
    }
    .hero-desc {
      color: rgba(255,255,255,0.88);
      font-size: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .course-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .course-badge {
      border: 1.5px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.75);
      padding: 0.2rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-block;
    }
    .cta-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: white;
      color: #1E3A8A;
      padding: 0.75rem 1.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid white;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #E0E7FF; border-color: #E0E7FF; }
    .btn-outline-white {
      background: transparent;
      color: white;
      padding: 0.75rem 1.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid rgba(255,255,255,0.6);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-outline-white:hover { border-color: white; color: white; }

    /* Stats Bar */
    .stats-bar {
      background: white;
      box-shadow: 0 -1px 0 rgba(30,58,138,0.08), 0 4px 20px rgba(0,0,0,0.05);
    }
    .stats-grid {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: space-around;
      align-items: center;
    }
    .stat-item {
      text-align: center;
      min-width: 120px;
      padding: 1.75rem 1.5rem;
      position: relative;
    }
    .stat-item + .stat-item::before {
      content: '';
      position: absolute; left: 0; top: 25%; height: 50%;
      width: 1px; background: rgba(30,58,138,0.12);
    }
    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 2.75rem;
      color: #1E3A8A;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .stat-label {
      font-size: 0.9rem;
      color: #6B7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.35rem;
    }

    /* Quote Section */
    .quote-section {
      background: #F7F7F5;
      padding: 5.5rem 2rem 5rem;
      border-top: 1px solid #E5E7EB;
      border-bottom: 1px solid #E5E7EB;
    }
    .quote-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.5rem;
    }
    .quote-text-block {
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }
    .quote-text-block.q-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .quote-body {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(2.6rem, 5vw, 4.5rem);
      line-height: 1.2;
      color: #1A1A1A;
      font-style: italic;
      font-weight: 400;
      text-align: center;
      margin: 0;
    }
    .quote-author-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .quote-attribution {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .quote-name {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 1.2rem;
      color: #1A1A1A;
      font-style: normal;
    }
    .quote-role {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1rem;
      color: #9CA3AF;
      font-weight: 400;
      font-style: normal;
    }
    @media (max-width: 640px) {
      .quote-body { font-size: 2rem; }
    }

    /* Labs Section */
    .labs-section {
      background: #FFFFFF;
      padding: 3.5rem 2rem;
    }
    .section-header {
      max-width: 1200px;
      margin: 0 auto 2.5rem;
    }
    .labs-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }
    @media (max-width: 900px) { .labs-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .hero-title { font-size: 4rem; }
      .hero-subtitle { font-size: 1.4rem; }
      .labs-grid { grid-template-columns: 1fr; }
      .stat-item + .stat-item::before { display: none; }
    }

    /* ── Fortschritt und Lab-Metadaten ───────────────────────────────────────
       Der Usability-Test bemaengelte, dass die Startseite weder Gesamtfortschritt
       noch Zeit- und Voraussetzungsuebersicht zeigt. Gespeichert wird nur lokal. */
    .progress-panel { max-width: 1200px; margin: 0 auto 2rem; background: #fff; border: 1px solid #E5E7EB; border-left: 5px solid var(--col-primary, #1E3A8A); border-radius: 0 10px 10px 0; padding: 1.25rem 1.5rem; }
    .progress-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; justify-content: space-between; }
    .progress-count { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--col-primary, #1E3A8A); }
    .progress-track { height: 8px; background: #E5E7EB; border-radius: 4px; margin: 0.85rem 0 0.6rem; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--col-primary, #1E3A8A); border-radius: 4px; transition: width 0.25s ease; }
    .progress-note { margin: 0; font-size: 0.82rem; line-height: 1.6; color: #4B5563; }
    .progress-reset { margin-top: 0.75rem; font-family: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.8rem; border-radius: 6px; border: 1.5px solid #9CA3AF; background: #fff; color: #4B5563; cursor: pointer; }
    .progress-reset:hover { background: #F3F4F6; }

    .lab-meta { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; margin: 0.75rem 0 1rem; font-size: 0.78rem; line-height: 1.5; }
    .lab-meta dt { font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; align-self: center; }
    .lab-meta dd { margin: 0; color: #374151; }
    .lab-done-btn { margin-top: 0.6rem; width: 100%; font-family: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1.5px solid #D1D5DB; background: #fff; color: #4B5563; cursor: pointer; }
    .lab-done-btn:hover { border-color: var(--col-primary, #1E3A8A); color: var(--col-primary, #1E3A8A); }
    .lab-done-btn.is-done { background: #F0FDF4; border-color: #059669; color: #065F46; }
    .lab-card-done .lab-num-badge { background: #059669; }
    .lab-card {
      border: 2px solid #1A1A1A;
      border-left: 4px solid #2563EB;
      border-radius: 0;
      background: white;
      padding: 1.75rem 1.75rem;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 220px;
    }
    .lab-num-badge {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 2.5rem;
      color: #2563EB;
      line-height: 1;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      position: static;
      padding: 0;
      background: none;
    }
    .lab-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #1E3A8A;
      margin-bottom: 0.1rem;
    }
    .lab-subtitle {
      font-size: 0.8rem;
      color: #6B7280;
      font-weight: 500;
    }
    .lab-desc {
      font-size: 0.875rem;
      color: #374151;
      line-height: 1.5;
      flex: 1;
    }
    .btn-lab-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% + 3.5rem);
      margin: auto -1.75rem -1.75rem;
      padding: 1rem 1.75rem;
      background: none;
      border-top: 1px solid #E5E7EB;
      color: #1A1A1A;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .btn-lab-link::after {
      content: '\2192';
      font-size: 1.1rem;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-lab-link:hover {
      background: #1E3A8A;
      color: white;
      border-top-color: #1E3A8A;
    }

    /* Bonus Card */
    .bonus-card {
      grid-column: span 3;
      border: 2px dashed #93C5FD;
      padding: 32px 32px 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #F8FAFF;
    }
    @media (max-width: 640px) {
      .bonus-card { grid-column: span 1; }
      .bonus-inner { grid-template-columns: 1fr !important; }
    }
    .bonus-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: white;
      background: #2563EB;
      border: none;
      padding: 4px 12px;
      margin-bottom: 16px;
      width: fit-content;
    }
    .bonus-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1E3A8A;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      line-height: 1.15;
    }
    .bonus-subtitle {
      font-size: 0.85rem;
      color: #4B5563;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .bonus-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .bonus-chip {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1E3A8A;
      background: #DBEAFE;
      padding: 5px 12px;
      border: none;
    }
    .bonus-inner {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 32px;
      align-items: start;
    }
    .bonus-divider {
      background: #BFDBFE;
      height: 100%;
      min-height: 160px;
    }
    .bonus-why {
      font-size: 1rem;
      color: #374151;
      line-height: 1.65;
      margin-bottom: 0;
    }
    .bonus-criteria {
      list-style: none;
      padding: 0; margin: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bonus-criteria li {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .bonus-crit-num {
      flex-shrink: 0;
      width: 24px; height: 24px;
      background: #1E3A8A;
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
      border-radius: 50%;
    }
    .bonus-crit-text strong {
      display: block;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1E3A8A;
      margin-bottom: 2px;
    }
    .bonus-crit-text span {
      font-size: 0.9rem;
      color: #4B5563;
      line-height: 1.5;
    }
    .btn-bonus-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px dashed #93C5FD;
      padding: 16px 0;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #1E3A8A;
      text-decoration: none;
      margin-top: 28px;
      transition: color 0.15s;
    }
    .btn-bonus-link:hover { color: #2563EB; }

    /* Footer */
    .footer {
      background: #1A1A1A;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 3rem 2rem;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .footer-sep {
      width: 48px;
      height: 3px;
      background: #2563EB;
      margin-bottom: 1.25rem;
    }
    .footer-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: white;
      letter-spacing: -0.01em;
    }
    .footer-tagline {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 0.35rem;
    }
    .footer-nav-label {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9CA3AF;
      margin-bottom: 0.75rem;
    }
    .footer-nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .footer-nav-links a {
      color: rgba(255,255,255,0.55);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-nav-links a:hover { color: white; }
    .footer-bottom {
      max-width: 1200px;
      margin: 2rem auto 0;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.35);
      font-size: 0.8rem;
      text-align: center;
    }

    /* ═══════════════════════════════════════════
       EN TEAL MODE
       DE = Navy (#1E3A8A) | EN = Teal (#0D9488)
       ═══════════════════════════════════════════ */
    [data-lang="en"] h2,
    [data-lang="en"] h3 { color: #0D9488; }
    [data-lang="en"] .bauhaus-accent-line { background: #14B8A6; }
    [data-lang="en"] .bauhaus-badge { background: #0D9488; }
    [data-lang="en"] .lab-card { border-left-color: #14B8A6; }

  <!-- Ausfallsicherung fuer die CDN-Abhaengigkeiten.
       React, ReactDOM und Babel kommen von unpkg.com. Faellt der Dienst aus
       oder sperrt ein Hochschulnetz die Domain, blieb die Seite bisher weiss
       und der Lernende sah keinen Hinweis, woran es liegt. Dieses Skript
       laeuft nach den drei Script-Tags und prueft, was tatsaechlich geladen
       wurde; ausserdem prueft es nach fuenf Sekunden, ob die App gemountet
       hat (faengt Transpilierungsfehler ab). -->
  <script>
  (function () {
    var isEn = new URLSearchParams(location.search).get('lang') === 'en'
            || (localStorage.getItem('bi-lang') || '') === 'en';
    var T = isEn ? {
      head: 'This page could not load',
      miss: 'The following libraries were not delivered:',
      why: 'The page loads React and Babel from unpkg.com at runtime. If your network blocks that host, or the service is unavailable, nothing can be rendered.',
      what: 'What you can do:',
      s1: 'Reload the page - the CDN is often only briefly unavailable.',
      s2: 'Try a different network (mobile hotspot instead of campus Wi-Fi).',
      s3: 'Check whether a proxy, VPN or content blocker is blocking unpkg.com.',
      s4: 'If it persists, report it - the lab content itself is fine, only the delivery failed.',
      slow: 'The libraries loaded, but the page did not render. That points to a script error rather than the network. Please report it with the browser console output.'
    } : {
      head: 'Diese Seite konnte nicht geladen werden',
      miss: 'Folgende Bibliotheken wurden nicht ausgeliefert:',
      why: 'Die Seite laedt React und Babel zur Laufzeit von unpkg.com. Sperrt das Netz diesen Host oder ist der Dienst gestoert, kann nichts dargestellt werden.',
      what: 'Was du tun kannst:',
      s1: 'Seite neu laden - das CDN ist oft nur kurz nicht erreichbar.',
      s2: 'Ein anderes Netz probieren (Mobilfunk statt Campus-WLAN).',
      s3: 'Pruefen, ob ein Proxy, VPN oder Contentblocker unpkg.com blockiert.',
      s4: 'Bleibt es dabei: melden - die Lab-Inhalte sind in Ordnung, nur die Auslieferung ist gescheitert.',
      slow: 'Die Bibliotheken sind geladen, die Seite hat aber nicht gerendert. Das deutet auf einen Skriptfehler hin, nicht auf das Netz. Bitte mit der Ausgabe der Browser-Konsole melden.'
    };

    function panel(title, body) {
      var root = document.getElementById('root') || document.body;
      root.innerHTML =
        '<div style="max-width:44rem;margin:4rem auto;padding:1.75rem;font-family:' +
        "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" +
        ';line-height:1.65;color:#1A1A1A;background:#fff;border:1px solid #E5E7EB;' +
        'border-left:5px solid #DC2626;border-radius:0 10px 10px 0">' +
        '<h1 style="margin:0 0 .75rem;font-size:1.3rem;color:#991B1B">' + title + '</h1>' +
        body +
        '<p style="margin-top:1.25rem;font-size:.85rem;color:#6B7280">' +
        '<a href="index.html" style="color:#1E3A8A">BI Lab</a> &middot; THWS Business School</p>' +
        '</div>';
    }

    var missing = [];
    if (typeof window.React === 'undefined') missing.push('React');
    if (typeof window.ReactDOM === 'undefined') missing.push('ReactDOM');
    if (typeof window.Babel === 'undefined') missing.push('Babel');

    if (missing.length) {
      panel(T.head,
        '<p><strong>' + T.miss + '</strong> ' + missing.join(', ') + '</p>' +
        '<p>' + T.why + '</p>' +
        '<p><strong>' + T.what + '</strong></p>' +
        '<ol style="padding-left:1.25rem"><li>' + T.s1 + '</li><li>' + T.s2 +
        '</li><li>' + T.s3 + '</li><li>' + T.s4 + '</li></ol>');
      return;
    }

    // Bibliotheken da, aber die App mountet nicht -> Skriptfehler.
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        panel(T.head, '<p>' + T.slow + '</p>');
      }
    }, 5000);
  })();
  </script>

                </div>
                <div className="cta-row">
                  <a href="#labs" className="btn-primary" style={{ background: 'white', color: heroColor, border: '2px solid white' }}>
                    {t.ctaLabs}
                  </a>
                  <a
                    href="https://github.com/swrobuts/sp_bi"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="btn-outline-white"
                  >
                    {t.ctaGithub}
                  </a>
                </div>
              </div>
            </section>

            {/* Stats Bar */}
            <div className="stats-bar">
              <div className="stats-grid">
                <div className="stat-item">
                  <div className="stat-value">{'6'}</div>
                  <div className="stat-label">{t.statLabs}</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{'1'}</div>
                  <div className="stat-label">{t.statFallstudie}</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value" style={{ fontSize: '1rem', letterSpacing: '0.02em', fontWeight: 900 }}>
                    {t.statTech}
                  </div>
                  <div className="stat-label">{t.statTechLabel}</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value" style={{ fontSize: '0.95rem', letterSpacing: '0.01em', fontWeight: 900 }}>
                    {t.statOpenSource}
                  </div>
                  <div className="stat-label">{t.statOpenSourceLabel}</div>
                </div>
              </div>
            </div>

          </div>{/* end viewport wrapper */}

          {/* Quote Strip */}
          <section className="quote-section">
            <div className="quote-inner">
              <div className="quote-text-block">
                <p className="quote-body">
                  <span style={{ display: 'block' }}>In God we trust.</span>
                  <span style={{ display: 'block' }}>All others must bring data.</span>
                </p>
              </div>
              <div className="quote-author-row">
                <img
                  src="deming.jpg"
                  alt="William Edwards Deming"
                  className="deming-portrait"
                />
                <div className="quote-attribution">
                  <span className="quote-name">
                    {'- William Edwards Deming'}
                  </span>
                  <span className="quote-role">
                    {lang === 'de'
                      ? 'Statistiker & Qualit\u00E4tsmanagement-Pionier'
                      : 'Statistician & Quality Management Pioneer'
                    }
                  </span>
                </div>
              </div>
            </div>
          </section>

          {/* Labs Grid */}
          <section className="labs-section" id="labs">
            <div className="section-header">
              <h2 style={{ fontSize: '2.25rem', marginBottom: '0.75rem' }}>{t.sectionLabs}</h2>
              <div className="bauhaus-accent-line"></div>
            </div>
            <div className="progress-panel">
              <div className="progress-head">
                <h3 style={{ margin: 0, fontSize: '1.05rem' }}>{t.progressTitle}</h3>
                <span className="progress-count">
                  {done.length} {t.progressOf} {t.labs.length} {t.progressDone}
                </span>
              </div>
              <div className="progress-track" role="progressbar"
                   aria-valuenow={done.length} aria-valuemin={0} aria-valuemax={t.labs.length}>
                <div className="progress-fill"
                     style={{ width: (done.length / t.labs.length * 100) + '%' }} />
              </div>
              <p className="progress-note">{t.progressText}</p>
              {done.length > 0 && (
                <button type="button" className="progress-reset" onClick={() => setDone([])}>
                  {t.progressReset}
                </button>
              )}
            </div>

            <div className="labs-grid">
              {t.labs.map((lab) => (
                <div key={lab.num} className={'lab-card' + (done.includes(lab.num) ? ' lab-card-done' : '')}>
                  <span className="lab-num-badge">{lab.num}</span>
                  <div>
                    <div className="lab-title">{lab.title}</div>
                    <div className="lab-subtitle">{lab.subtitle}</div>
                  </div>
                  <p className="lab-desc">{lab.desc}</p>
                  <dl className="lab-meta">
                    <dt>{t.labTime}</dt><dd>{lab.time}</dd>
                    <dt>{t.labPrereq}</dt><dd>{lab.prereq}</dd>
                  </dl>
                  <a
                    href={`${lab.link}${lang === 'en' ? '?lang=en' : ''}`}
                    className="btn-lab-link"
                  >
                    {t.labLink}
                  </a>
                  <button
                    type="button"
                    className={'lab-done-btn' + (done.includes(lab.num) ? ' is-done' : '')}
                    aria-pressed={done.includes(lab.num)}
                    onClick={() => toggleDone(lab.num)}
                  >
                    {done.includes(lab.num) ? '\u2713 ' + t.progressMarked : t.progressMark}
                  </button>
                </div>
              ))}

              {/* Bonus Card */}
              <div className="bonus-card">
                <span className="bonus-badge">{t.bonusBadge}</span>
                <div className="bonus-title">{t.bonusTitle}</div>
                <div className="bonus-subtitle">{t.bonusSubtitle}</div>
                <div className="bonus-highlights">
                  <span className="bonus-chip">Apache Superset</span>
                  <span className="bonus-chip">Metabase</span>
                  <span className="bonus-chip">Docker</span>
                  <span className="bonus-chip">PostgreSQL</span>
                  <span className="bonus-chip">DSGVO</span>
                  <span className="bonus-chip">Self-Hosted</span>
                </div>
                <div className="bonus-inner">
                  <div>
                    <p className="bonus-why">{t.bonusWhy}</p>
                  </div>
                  <div className="bonus-divider" />
                  <ul className="bonus-criteria">
                    {bonusCriteria.map((c, i) => (
                      <li key={i}>
                        <div className="bonus-crit-num">{i + 1}</div>
                        <div className="bonus-crit-text">
                          <strong>{lang === 'en' ? c.titleEn : c.titleDe}</strong>
                          <span>{lang === 'en' ? c.descEn : c.descDe}</span>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>
                <a
                  href={`lab-06-souveraenitaet.html${lang === 'en' ? '?lang=en' : ''}`}
                  className="btn-bonus-link"
                >
                  <span>{t.bonusLink}</span>
                </a>
              </div>
            </div>
          </section>

          {/* Implementierte Dashboards */}
          <section className="dashboards-section">
            <div className="section-header">
              <h2 style={{ fontSize: '2.25rem', marginBottom: '0.75rem' }}>{t.sectionDashboards}</h2>
              <div className="bauhaus-accent-line"></div>
              <p style={{ color: '#6B7280', maxWidth: '640px', marginBottom: '2rem' }}>{t.dashboardsDesc}</p>
            </div>
            <div className="dashboards-grid">
              {t.dashboards.map((d, i) => (
                <a
                  key={i}
                  href={d.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="dashboard-card"
                >
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '0.5rem' }}>
                    <span className="dashboard-card-name">{d.name}</span>
                    <span className="live-badge">{'LIVE'}</span>
                  </div>
                  <p className="dashboard-card-desc">{d.desc}</p>
                  <span className="dashboard-card-tech">{d.tech}</span>
                </a>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer className="footer">
            <div className="footer-inner">
              <div>
                <div className="footer-sep"></div>
                <div className="footer-logo">{'BI Lab'}</div>
                <div className="footer-tagline">{t.footerTagline}</div>
              </div>
              <div>
                <div className="footer-nav-label">{t.footerNavLabel}</div>
                <nav className="footer-nav-links">
                  {t.labs.map((lab) => (
                    <a
                      key={lab.num}
                      href={`${lab.link}${lang === 'en' ? '?lang=en' : ''}`}
                    >
                      {`${lab.num} - ${lab.title}`}
                    </a>
                  ))}
                </nav>
              </div>
            </div>
            <div className="footer-bottom">
              {t.footerText}
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
